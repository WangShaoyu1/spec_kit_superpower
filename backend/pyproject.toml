[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartchef-backend"
version = "0.1.0"
description = "Formal SmartChef backend skeleton"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "cryptography>=46.0.2"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "alembic>=1.14"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
