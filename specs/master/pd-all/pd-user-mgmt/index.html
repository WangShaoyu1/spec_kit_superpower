<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 | SmartChef PD</title>
    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Dayjs -->
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
    <!-- Ant Design 6.3.1 -->
    <link rel="stylesheet" href="https://unpkg.com/antd@6.3.1/dist/reset.css">
    <link rel="stylesheet" href="https://unpkg.com/antd@6.3.1/dist/antd.css">
    <script src="https://unpkg.com/antd@6.3.1/dist/antd.min.js"></script>
    <!-- Ant Design Icons -->
    <script src="https://unpkg.com/@ant-design/icons@5.3.7/dist/index.umd.min.js"></script>
    <!-- Mermaid -->
    <script src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }

        .page-layout { min-height: 100vh; }
        .sidebar { background: #001529; color: #fff; position: fixed; height: 100vh; overflow: auto; }
        .sidebar-header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo { font-size: 18px; font-weight: 600; }
        .sidebar-subtitle { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }

        .main-content { margin-left: 260px; padding: 24px 32px; }
        .main-content-no-sider { margin-left: 0 !important; }
        .page-header { background: #fff; padding: 24px 32px; margin: -24px -32px 24px; border-bottom: 1px solid #f0f0f0; }

        .drawer-section { margin-bottom: 24px; }
        .drawer-section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #262626; border-left: 4px solid #1890ff; padding-left: 12px; }

        .role-card { border-radius: 8px; height: 100%; }
        .role-card .role-header { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .perm-icon-ok { color: #52c41a; font-size: 16px; }
        .perm-icon-no { color: #ff4d4f; font-size: 16px; }
        .perm-icon-cond { color: #fa8c16; font-size: 16px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        mermaid.initialize({
            startOnLoad: false,
            theme: "default",
            flowchart: { useMaxWidth: true, htmlLabels: true, curve: "basis" }
        });

        const { useState, useMemo, useCallback, useEffect } = React;
        const antd = window.antd;
        const icons = window.icons;
        const {
            Layout, Menu, Button, Table, Tag, Alert, Card, Input, Select, Space,
            Drawer, Tabs, List, message, Statistic, Row, Col, Tooltip, Modal,
            Form, Divider, Switch, Descriptions
        } = antd;
        const {
            SettingOutlined, DatabaseOutlined, FileTextOutlined, RobotOutlined,
            MessageOutlined, ExperimentOutlined, RocketOutlined, UserOutlined,
            BarChartOutlined, QuestionCircleOutlined, ColumnWidthOutlined,
            PlusOutlined, EditOutlined, KeyOutlined, CheckCircleOutlined,
            CloseCircleOutlined, WarningOutlined, LockOutlined, TeamOutlined,
            SafetyCertificateOutlined, ExclamationCircleOutlined
        } = icons;

        const { Sider, Content } = Layout;
        const { Option } = Select;
        const { Password } = Input;

        // ── Mock Data ──

        const mockUsers = [
            { id: "user_001", username: "admin", name: "管理员", role: "admin", status: "active", createdAt: "2026-02-01", lastLogin: "2026-03-18 08:30" },
            { id: "user_002", username: "wang_pm", name: "小王", role: "pm", status: "active", createdAt: "2026-02-15", lastLogin: "2026-03-17 16:00" },
            { id: "user_003", username: "li_pm", name: "小李", role: "pm", status: "active", createdAt: "2026-03-01", lastLogin: "2026-03-18 09:15" },
            { id: "user_004", username: "zhang_test", name: "小张", role: "tester", status: "active", createdAt: "2026-03-05", lastLogin: "2026-03-16 14:20" }
        ];

        const ROLE_MAP = {
            admin: { label: "系统管理员", color: "red" },
            pm: { label: "产品经理", color: "blue" },
            tester: { label: "测试人员", color: "green" }
        };

        const STATUS_MAP = {
            active: { label: "启用", color: "green" },
            disabled: { label: "禁用", color: "default" }
        };

        const PERMISSIONS = [
            { key: "intent_library_read", label: "查看指令库列表", admin: "ok", pm: "ok", tester: "ok" },
            { key: "intent_library_write", label: "创建/编辑指令库", admin: "ok", pm: "cond", pmTip: "仅自己创建的", tester: "no" },
            { key: "intent_library_delete", label: "删除指令库", admin: "ok", pm: "cond", pmTip: "仅自己+草稿", tester: "no" },
            { key: "model_train", label: "创建训练任务", admin: "ok", pm: "ok", tester: "no" },
            { key: "model_test_manage", label: "管理 testable 模型", admin: "ok", pm: "ok", tester: "ok" },
            { key: "model_publish", label: "发布模型", admin: "ok", pm: "cond", pmTip: "需审批", tester: "no" },
            { key: "profile_read", label: "查看对话方案", admin: "ok", pm: "ok", tester: "ok" },
            { key: "profile_write", label: "创建/编辑方案", admin: "ok", pm: "ok", tester: "no" },
            { key: "profile_publish", label: "发布方案", admin: "ok", pm: "cond", pmTip: "需审批", tester: "no" },
            { key: "knowledge_write", label: "上传/管理知识库", admin: "ok", pm: "ok", tester: "no" },
            { key: "test_execute", label: "执行测试", admin: "ok", pm: "ok", tester: "ok" },
            { key: "monitoring_read", label: "查看监控", admin: "ok", pm: "ok", tester: "ok" },
            { key: "alert_manage", label: "管理告警规则", admin: "ok", pm: "no", tester: "no" },
            { key: "user_manage", label: "用户管理", admin: "ok", pm: "no", tester: "no" }
        ];

        function PermIcon({ value, tip }) {
            if (value === "ok") return <CheckCircleOutlined className="perm-icon-ok" />;
            if (value === "no") return <CloseCircleOutlined className="perm-icon-no" />;
            return <Tooltip title={tip}><WarningOutlined className="perm-icon-cond" /></Tooltip>;
        }

        // ── App ──

        function App() {
            const inIframe = typeof window !== "undefined" && window.self !== window.top;
            const [selectedKeys, setSelectedKeys] = useState(["users"]);
            const [openKeys, setOpenKeys] = useState(["system"]);
            const [drawerVisible, setDrawerVisible] = useState(false);
            const [drawerWidth, setDrawerWidth] = useState(1200);
            const [activeTab, setActiveTab] = useState("accounts");

            const [users, setUsers] = useState(mockUsers);
            const [createModalOpen, setCreateModalOpen] = useState(false);
            const [editRoleOpen, setEditRoleOpen] = useState(false);
            const [editingUser, setEditingUser] = useState(null);
            const [createForm] = Form.useForm();
            const [editRoleForm] = Form.useForm();

            // ── Navigation ──

            const goTo = (page) => {
                const map = {
                    "libraries": "../pd-intent-library/index.html",
                    "datasets": "../pd-intent-library/datasets.html",
                    "profiles": "../pd-dialog-profile/index.html",
                    "manual-test": "../pd-dialog-profile/test-chat.html",
                    "batch-test": "../pd-batch-test/index.html",
                    "monitoring": "../pd-monitoring/index.html",
                    "users": "index.html"
                };
                if (map[page]) window.location.href = map[page];
            };

            const handleOpenChange = useCallback((keys) => {
                setOpenKeys(keys);
            }, []);

            const toggleDrawerWidth = () => {
                setDrawerWidth(prev => prev === 1200 ? 800 : 1200);
            };

            // ── Mermaid rendering ──

            useEffect(() => {
                if (drawerVisible) {
                    setTimeout(() => {
                        mermaid.init(undefined, document.querySelectorAll(".mermaid"));
                    }, 500);
                }
            }, [drawerVisible]);

            // ── Stats ──

            const stats = useMemo(() => {
                const total = users.length;
                const adminCount = users.filter(u => u.role === "admin").length;
                const pmCount = users.filter(u => u.role === "pm").length;
                const testerCount = users.filter(u => u.role === "tester").length;
                return { total, adminCount, pmCount, testerCount };
            }, [users]);

            // ── Handlers ──

            const handleCreateAccount = () => {
                createForm.validateFields().then(values => {
                    const newUser = {
                        id: "user_" + String(users.length + 1).padStart(3, "0"),
                        username: values.username,
                        name: values.name,
                        role: values.role,
                        status: "active",
                        createdAt: dayjs().format("YYYY-MM-DD"),
                        lastLogin: "-"
                    };
                    setUsers([...users, newUser]);
                    setCreateModalOpen(false);
                    createForm.resetFields();
                    message.success("账号 " + values.username + " 创建成功");
                });
            };

            const handleEditRole = (record) => {
                setEditingUser(record);
                editRoleForm.setFieldsValue({ newRole: record.role });
                setEditRoleOpen(true);
            };

            const handleSaveRole = () => {
                editRoleForm.validateFields().then(values => {
                    setUsers(users.map(u =>
                        u.id === editingUser.id ? { ...u, role: values.newRole } : u
                    ));
                    setEditRoleOpen(false);
                    setEditingUser(null);
                    message.success("角色已更新");
                });
            };

            const handleResetPassword = (record) => {
                Modal.confirm({
                    title: "重置密码",
                    icon: <ExclamationCircleOutlined />,
                    content: "确定要重置用户 " + record.name + " (" + record.username + ") 的密码吗？重置后密码将变为默认密码 Abc12345。",
                    okText: "确认重置",
                    cancelText: "取消",
                    okButtonProps: { danger: true },
                    onOk: () => message.success(record.username + " 的密码已重置为 Abc12345")
                });
            };

            const handleToggleStatus = (record) => {
                if (record.username === "admin") {
                    message.error("不能禁用内置管理员账号");
                    return;
                }
                const newStatus = record.status === "active" ? "disabled" : "active";
                setUsers(users.map(u =>
                    u.id === record.id ? { ...u, status: newStatus } : u
                ));
                message.success(record.name + " 已" + (newStatus === "active" ? "启用" : "禁用"));
            };

            // ── Role permission preview for edit modal ──

            const rolePermissionPreview = (role) => {
                if (!role) return [];
                return PERMISSIONS.map(p => ({
                    key: p.key,
                    label: p.label,
                    value: p[role],
                    tip: role === "pm" ? p.pmTip : undefined
                }));
            };

            // ── Table columns ──

            const userColumns = [
                { title: "用户名", dataIndex: "username", key: "username", width: 120, render: (val) => <span style={{ fontFamily: "monospace" }}>{val}</span> },
                { title: "姓名", dataIndex: "name", key: "name", width: 100 },
                {
                    title: "角色", dataIndex: "role", key: "role", width: 120,
                    render: (val) => { const r = ROLE_MAP[val]; return <Tag color={r.color}>{r.label}</Tag>; }
                },
                {
                    title: "状态", dataIndex: "status", key: "status", width: 80,
                    render: (val) => { const s = STATUS_MAP[val]; return <Tag color={s.color}>{s.label}</Tag>; }
                },
                { title: "创建时间", dataIndex: "createdAt", key: "createdAt", width: 120 },
                { title: "最后登录", dataIndex: "lastLogin", key: "lastLogin", width: 160 },
                {
                    title: "操作", key: "actions", width: 260,
                    render: (_, record) => (
                        <Space size="small">
                            <Button type="link" size="small" icon={<EditOutlined />} onClick={() => handleEditRole(record)}>编辑角色</Button>
                            <Button type="link" size="small" icon={<KeyOutlined />} onClick={() => handleResetPassword(record)}>重置密码</Button>
                            <Switch
                                size="small"
                                checked={record.status === "active"}
                                checkedChildren="启用"
                                unCheckedChildren="禁用"
                                onChange={() => handleToggleStatus(record)}
                            />
                        </Space>
                    )
                }
            ];

            // ── Permission matrix columns ──

            const permColumns = [
                { title: "能力点", dataIndex: "key", key: "key", width: 180, render: (val) => <span style={{ fontFamily: "monospace", fontSize: 12 }}>{val}</span> },
                { title: "说明", dataIndex: "label", key: "label", width: 180 },
                {
                    title: "系统管理员", key: "admin", width: 120, align: "center",
                    render: (_, record) => <PermIcon value={record.admin} />
                },
                {
                    title: "产品经理", key: "pm", width: 120, align: "center",
                    render: (_, record) => <PermIcon value={record.pm} tip={record.pmTip} />
                },
                {
                    title: "测试人员", key: "tester", width: 120, align: "center",
                    render: (_, record) => <PermIcon value={record.tester} />
                }
            ];

            // ── Menu ──

            const menuItems = [
                {
                    key: "config",
                    icon: <SettingOutlined />,
                    label: "配置管理",
                    children: [
                        { key: "libraries", icon: <DatabaseOutlined />, label: "指令库管理", onClick: () => goTo("libraries") },
                        { key: "datasets", icon: <FileTextOutlined />, label: "数据集管理", onClick: () => goTo("datasets") },
                        { key: "profiles", icon: <RobotOutlined />, label: "对话方案", onClick: () => goTo("profiles") }
                    ]
                },
                {
                    key: "testing",
                    icon: <ExperimentOutlined />,
                    label: "测试验证",
                    children: [
                        { key: "manual-test", icon: <MessageOutlined />, label: "手动测试", onClick: () => goTo("manual-test") },
                        { key: "batch-test", icon: <ExperimentOutlined />, label: "批量测试", onClick: () => goTo("batch-test") }
                    ]
                },
                {
                    key: "system",
                    icon: <UserOutlined />,
                    label: "系统管理",
                    children: [
                        { key: "versions", icon: <RocketOutlined />, label: "版本管理" },
                        { key: "users", icon: <UserOutlined />, label: "用户管理", onClick: () => goTo("users") },
                        { key: "monitoring", icon: <BarChartOutlined />, label: "监控仪表盘", onClick: () => goTo("monitoring") }
                    ]
                }
            ];

            // ── Role cards for Tab 2 ──

            const roleCards = [
                {
                    role: "admin", title: "系统管理员", color: "#ff4d4f", icon: <SafetyCertificateOutlined />,
                    perms: ["所有 CRUD 操作", "发布审批（直接发布）", "用户管理", "告警规则管理", "全部监控数据查看"]
                },
                {
                    role: "pm", title: "产品经理", color: "#1890ff", icon: <TeamOutlined />,
                    perms: ["自己创建的 CRUD", "查看他人的指令库/方案", "创建训练任务", "发布申请（需管理员审批）", "执行测试"]
                },
                {
                    role: "tester", title: "测试人员", color: "#52c41a", icon: <ExperimentOutlined />,
                    perms: ["查看指令库/方案/监控", "执行测试（手动+批量）", "管理 testable 模型", "不可编辑/删除/发布"]
                }
            ];

            // ── Drawer tabs ──

            const drawerTabs = [
                {
                    key: "flow",
                    label: "数据流向",
                    children: (
                        <div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">账号创建到权限生效全链路</div>
                                <pre style={{ background: "#f5f5f5", padding: 16, borderRadius: 4, overflow: "auto", fontSize: 13, lineHeight: 1.8 }}>
{`[管理员操作]  创建账号
    ├─ 填写用户名、姓名、初始密码
    ├─ 选择角色 (admin / pm / tester)
    └─ 提交创建请求
           ↓
[角色映射]  角色 → 能力点集合
    ├─ admin  → 全部能力点
    ├─ pm     → 受限能力点 (部分需审批)
    └─ tester → 只读 + 测试能力点
           ↓
[前端控制]  菜单可见性
    ├─ 根据能力点动态渲染侧边栏
    ├─ 无权限菜单项隐藏
    └─ 按钮级权限控制 (如发布按钮)
           ↓
[后端校验]  API 权限拦截
    ├─ JWT Token 携带角色信息
    ├─ 中间件校验能力点
    └─ 无权限返回 403 Forbidden`}
                                </pre>
                            </div>
                            <Alert
                                message="能力点优先于角色名"
                                description="权限校验以能力点 (capability) 为准，不直接绑定角色名。角色只是能力点的预设组合，方便批量分配。未来可扩展自定义角色。"
                                type="info"
                                showIcon
                            />
                        </div>
                    )
                },
                {
                    key: "state",
                    label: "状态流转",
                    children: (
                        <div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">账号状态机</div>
                                <pre style={{ background: "#f5f5f5", padding: 16, borderRadius: 4, overflow: "auto", fontSize: 13, lineHeight: 1.8 }}>
{`           创建
             │
             ▼
    ┌─── [active] ◄───┐
    │     启用状态      │
    │                   │
    │  管理员禁用       │ 管理员启用
    │                   │
    ▼                   │
 [disabled] ───────────┘
   禁用状态

  约束:
  - admin 内置账号不可禁用
  - 禁用后该用户 Token 立即失效
  - 禁用状态可随时恢复为启用
  - 没有"删除"操作，仅禁用`}
                                </pre>
                            </div>
                            <List
                                size="small"
                                bordered
                                style={{ marginTop: 16 }}
                                dataSource={[
                                    { state: "active", desc: "账号正常可用，可登录系统，按角色权限访问功能" },
                                    { state: "disabled", desc: "账号被禁用，无法登录，已有会话立即失效，但账号数据保留" }
                                ]}
                                renderItem={item => (
                                    <List.Item>
                                        <Tag color="blue" style={{ fontFamily: "monospace" }}>{item.state}</Tag> {item.desc}
                                    </List.Item>
                                )}
                            />
                        </div>
                    )
                },
                {
                    key: "fields",
                    label: "字段说明",
                    children: (
                        <div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">用户字段</div>
                                <Table
                                    size="small"
                                    pagination={false}
                                    rowKey="field"
                                    columns={[
                                        { title: "字段", dataIndex: "field", width: 120 },
                                        { title: "类型", dataIndex: "type", width: 80 },
                                        { title: "说明", dataIndex: "desc" }
                                    ]}
                                    dataSource={[
                                        { field: "id", type: "string", desc: "用户唯一标识，格式 user_XXX" },
                                        { field: "username", type: "string", desc: "登录用户名，唯一，仅字母数字下划线，3-20 位" },
                                        { field: "name", type: "string", desc: "用户姓名/昵称，用于前端展示" },
                                        { field: "role", type: "enum", desc: "角色：admin / pm / tester" },
                                        { field: "status", type: "enum", desc: "账号状态：active / disabled" },
                                        { field: "createdAt", type: "date", desc: "账号创建日期" },
                                        { field: "lastLogin", type: "datetime", desc: "最后登录时间，未登录显示 -" }
                                    ]}
                                />
                            </div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">角色字段</div>
                                <Table
                                    size="small"
                                    pagination={false}
                                    rowKey="field"
                                    columns={[
                                        { title: "字段", dataIndex: "field", width: 120 },
                                        { title: "类型", dataIndex: "type", width: 80 },
                                        { title: "说明", dataIndex: "desc" }
                                    ]}
                                    dataSource={[
                                        { field: "role_key", type: "string", desc: "角色标识：admin / pm / tester" },
                                        { field: "role_label", type: "string", desc: "角色中文名称" },
                                        { field: "capabilities", type: "string[]", desc: "该角色拥有的能力点列表" }
                                    ]}
                                />
                            </div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">能力点字段</div>
                                <Table
                                    size="small"
                                    pagination={false}
                                    rowKey="field"
                                    columns={[
                                        { title: "字段", dataIndex: "field", width: 140 },
                                        { title: "类型", dataIndex: "type", width: 80 },
                                        { title: "说明", dataIndex: "desc" }
                                    ]}
                                    dataSource={[
                                        { field: "capability_key", type: "string", desc: "能力点标识，如 intent_library_read" },
                                        { field: "description", type: "string", desc: "能力点中文描述" },
                                        { field: "condition", type: "string?", desc: "有条件的能力点附带条件说明（如 仅自己+草稿）" }
                                    ]}
                                />
                            </div>
                        </div>
                    )
                },
                {
                    key: "operations",
                    label: "操作说明",
                    children: (
                        <div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">创建账号流程</div>
                                <div className="mermaid" key="op-create">
{`flowchart TD
    A[点击新建账号] --> B[弹出创建表单]
    B --> C[填写用户名/姓名/密码]
    C --> D[选择角色]
    D --> E{表单校验}
    E -->|通过| F[调用创建 API]
    E -->|失败| G[显示校验错误]
    G --> C
    F --> H{用户名已存在?}
    H -->|是| I[提示重复]
    I --> C
    H -->|否| J[创建成功]
    J --> K[刷新用户列表]`}
                                </div>
                            </div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">编辑角色流程</div>
                                <div className="mermaid" key="op-edit-role">
{`flowchart TD
    A[点击编辑角色] --> B[弹出角色编辑]
    B --> C[显示当前角色]
    C --> D[选择新角色]
    D --> E[预览权限变化]
    E --> F{确认修改?}
    F -->|是| G[调用更新 API]
    F -->|否| H[关闭弹窗]
    G --> I[更新成功]
    I --> J[刷新列表]`}
                                </div>
                            </div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">重置密码流程</div>
                                <div className="mermaid" key="op-reset-pwd">
{`flowchart TD
    A[点击重置密码] --> B[弹出确认框]
    B --> C{确认重置?}
    C -->|是| D[密码重置为默认值]
    D --> E[通知用户修改]
    C -->|否| F[取消操作]`}
                                </div>
                            </div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">禁用账号流程</div>
                                <div className="mermaid" key="op-disable">
{`flowchart TD
    A[切换禁用开关] --> B{是内置 admin?}
    B -->|是| C[拒绝: 不可禁用]
    B -->|否| D[更新状态为 disabled]
    D --> E[该用户 Token 失效]
    E --> F[用户被踢出登录]`}
                                </div>
                            </div>
                        </div>
                    )
                },
                {
                    key: "logic",
                    label: "业务逻辑",
                    children: (
                        <div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">RBAC 权限模型</div>
                                <div style={{ lineHeight: 1.8, marginBottom: 16 }}>
                                    <ol>
                                        <li><strong>基于能力点 (Capability-Based)</strong>：系统不直接检查角色名称，而是检查用户是否拥有对应的能力点 (capability)。</li>
                                        <li><strong>角色是能力点的预设组合</strong>：admin 角色包含全部 14 个能力点；pm 包含 10 个（其中 3 个有条件）；tester 包含 6 个。</li>
                                        <li><strong>条件能力点</strong>：部分能力点附带条件限制，如 pm 的 intent_library_write 仅限自己创建的指令库。</li>
                                        <li><strong>前后端双重校验</strong>：前端控制菜单/按钮可见性，后端 API 中间件独立校验能力点。</li>
                                    </ol>
                                </div>
                            </div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">内置管理员保护</div>
                                <div style={{ lineHeight: 1.8, marginBottom: 16 }}>
                                    <ul style={{ paddingLeft: 20 }}>
                                        <li>内置 admin 账号始终存在，不可删除或禁用</li>
                                        <li>admin 不可修改自己的角色（防止失去管理权限）</li>
                                        <li>系统至少保留一个 admin 角色用户</li>
                                        <li>密码重置后应立即修改默认密码</li>
                                    </ul>
                                </div>
                                <Alert
                                    message="最少管理员策略"
                                    description="系统强制要求至少存在 1 个启用状态的管理员账号。如果尝试禁用最后一个管理员，操作将被拒绝。"
                                    type="warning"
                                    showIcon
                                />
                            </div>
                            <div className="drawer-section">
                                <div className="drawer-section-title">用户规模预期</div>
                                <div style={{ lineHeight: 1.8 }}>
                                    <p>FR-001 规定仅 2-3 个产品经理使用本平台，因此：</p>
                                    <ul style={{ paddingLeft: 20 }}>
                                        <li>用户总数不超过 10 人，无分页需求</li>
                                        <li>不需要复杂的搜索/筛选功能</li>
                                        <li>不需要批量导入/导出用户</li>
                                        <li>角色固定 3 种，暂不支持自定义角色</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    )
                },
                {
                    key: "tips",
                    label: "易错点",
                    children: (
                        <div>
                            <Alert
                                message="不要删除内置 admin 账号"
                                description="内置管理员账号是系统初始化创建的唯一超级管理员，没有恢复机制。如需更换管理员，应先创建新 admin 账号，再考虑禁用旧的（但不能禁用最后一个 admin）。"
                                type="error"
                                style={{ marginBottom: 12 }}
                            />
                            <Alert
                                message="权限传播延迟"
                                description="修改用户角色后，如果该用户已登录，新权限不会立即生效。用户需要重新登录（或等待 Token 过期后刷新）才能获取新的能力点集合。建议修改角色后通知用户重新登录。"
                                type="warning"
                                style={{ marginBottom: 12 }}
                            />
                            <Alert
                                message="最后一个管理员保护"
                                description="如果系统中只剩一个启用的 admin 账号，该账号不允许被禁用或角色降级。否则将无人能管理系统。尝试此操作时应弹出明确错误提示。"
                                type="warning"
                                style={{ marginBottom: 12 }}
                            />
                            <Alert
                                message="密码重置安全"
                                description="重置密码后默认密码是固定值 (Abc12345)，存在被猜测风险。应在通知用户时强调立即修改密码，后续可考虑发送随机临时密码到邮箱。"
                                type="info"
                                style={{ marginBottom: 12 }}
                            />
                            <Alert
                                message="能力点 vs 角色名"
                                description="后端校验必须基于能力点，不能写 if role === 'admin' 这样的硬编码。否则未来扩展自定义角色时会出现权限漏洞。所有权限判断应使用 hasCapability('xxx') 方式。"
                                type="info"
                            />
                        </div>
                    )
                }
            ];

            // ── Tab content ──

            const tabItems = [
                {
                    key: "accounts",
                    label: "账号管理",
                    children: (
                        <div>
                            <Row gutter={16} style={{ marginBottom: 24 }}>
                                <Col span={6}>
                                    <Card><Statistic title="总账号数" value={stats.total} prefix={<TeamOutlined />} /></Card>
                                </Col>
                                <Col span={6}>
                                    <Card><Statistic title="管理员" value={stats.adminCount} valueStyle={{ color: "#ff4d4f" }} prefix={<SafetyCertificateOutlined />} /></Card>
                                </Col>
                                <Col span={6}>
                                    <Card><Statistic title="产品经理" value={stats.pmCount} valueStyle={{ color: "#1890ff" }} prefix={<UserOutlined />} /></Card>
                                </Col>
                                <Col span={6}>
                                    <Card><Statistic title="测试人员" value={stats.testerCount} valueStyle={{ color: "#52c41a" }} prefix={<ExperimentOutlined />} /></Card>
                                </Col>
                            </Row>
                            <Card>
                                <Table
                                    columns={userColumns}
                                    dataSource={users}
                                    rowKey="id"
                                    pagination={false}
                                    size="middle"
                                />
                            </Card>
                        </div>
                    )
                },
                {
                    key: "roles",
                    label: "角色与权限",
                    children: (
                        <div>
                            <div style={{ marginBottom: 16 }}>
                                <h3 style={{ fontSize: 16, fontWeight: 600, marginBottom: 8 }}>角色定义与能力点矩阵</h3>
                                <Alert
                                    message="权限校验以能力点为准，不绑定角色名。角色是能力点的预设组合。"
                                    type="info"
                                    showIcon
                                    style={{ marginBottom: 16 }}
                                />
                            </div>

                            <Row gutter={16} style={{ marginBottom: 24 }}>
                                {roleCards.map(rc => (
                                    <Col span={8} key={rc.role}>
                                        <Card className="role-card" style={{ borderTop: "3px solid " + rc.color }}>
                                            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                                                <span style={{ fontSize: 24, color: rc.color }}>{rc.icon}</span>
                                                <span className="role-header" style={{ color: rc.color }}>{rc.title}</span>
                                            </div>
                                            <List
                                                size="small"
                                                dataSource={rc.perms}
                                                renderItem={item => (
                                                    <List.Item style={{ padding: "6px 0", border: "none" }}>
                                                        <Space><CheckCircleOutlined style={{ color: rc.color, fontSize: 12 }} /><span style={{ fontSize: 13 }}>{item}</span></Space>
                                                    </List.Item>
                                                )}
                                            />
                                        </Card>
                                    </Col>
                                ))}
                            </Row>

                            <Card title="能力点权限矩阵">
                                <Table
                                    columns={permColumns}
                                    dataSource={PERMISSIONS}
                                    rowKey="key"
                                    pagination={false}
                                    size="small"
                                    bordered
                                />
                            </Card>
                        </div>
                    )
                }
            ];

            // ── Render ──

            return (
                <Layout className="page-layout">
                    {!inIframe && (
                    <Sider trigger={null} width={260} className="sidebar">
                        <div className="sidebar-header">
                            <div className="sidebar-logo">SmartChef</div>
                            <div className="sidebar-subtitle">智能对话管理平台</div>
                        </div>
                        <Menu theme="dark" mode="inline" selectedKeys={selectedKeys} openKeys={openKeys} onOpenChange={handleOpenChange} onSelect={({ key }) => setSelectedKeys([key])} items={menuItems} />
                    </Sider>
                    )}

                    <Content className={"main-content" + (inIframe ? " main-content-no-sider" : "")}>
                        <div className="page-header">
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                                <div>
                                    <h1 style={{ fontSize: 24, fontWeight: 600, marginBottom: 8 }}>用户管理</h1>
                                    <p style={{ color: "#8c8c8c", fontSize: 14 }}>管理系统账号、角色定义和菜单权限分配</p>
                                </div>
                                <Space>
                                    <Tooltip title="查看数据流向、权限模型、业务逻辑和易错点">
                                        <Button icon={<QuestionCircleOutlined />} onClick={() => setDrawerVisible(true)}>说明</Button>
                                    </Tooltip>
                                    <Button type="primary" icon={<PlusOutlined />} onClick={() => setCreateModalOpen(true)}>新建账号</Button>
                                </Space>
                            </div>
                        </div>

                        <Tabs
                            activeKey={activeTab}
                            onChange={setActiveTab}
                            items={tabItems}
                            style={{ marginBottom: 24 }}
                        />
                    </Content>

                    {/* Create Account Modal */}
                    <Modal
                        title="新建账号"
                        open={createModalOpen}
                        onOk={handleCreateAccount}
                        onCancel={() => { setCreateModalOpen(false); createForm.resetFields(); }}
                        okText="创建"
                        cancelText="取消"
                        maskClosable={false}
                        width={480}
                    >
                        <Form form={createForm} layout="vertical" style={{ marginTop: 16 }}>
                            <Form.Item
                                name="username"
                                label="用户名"
                                rules={[
                                    { required: true, message: "请输入用户名" },
                                    { pattern: /^[a-zA-Z0-9_]{3,20}$/, message: "3-20位字母数字下划线" }
                                ]}
                            >
                                <Input placeholder="仅字母、数字、下划线" />
                            </Form.Item>
                            <Form.Item
                                name="name"
                                label="姓名"
                                rules={[{ required: true, message: "请输入姓名" }]}
                            >
                                <Input placeholder="用于前端展示" />
                            </Form.Item>
                            <Form.Item
                                name="password"
                                label="初始密码"
                                rules={[
                                    { required: true, message: "请输入初始密码" },
                                    { min: 8, message: "密码至少 8 位" }
                                ]}
                            >
                                <Password placeholder="至少 8 位" />
                            </Form.Item>
                            <Form.Item
                                name="role"
                                label="角色"
                                rules={[{ required: true, message: "请选择角色" }]}
                                initialValue="pm"
                            >
                                <Select>
                                    <Option value="admin">系统管理员</Option>
                                    <Option value="pm">产品经理</Option>
                                    <Option value="tester">测试人员</Option>
                                </Select>
                            </Form.Item>
                        </Form>
                    </Modal>

                    {/* Edit Role Modal */}
                    <Modal
                        title={"编辑角色 - " + (editingUser ? editingUser.name : "")}
                        open={editRoleOpen}
                        onOk={handleSaveRole}
                        onCancel={() => { setEditRoleOpen(false); setEditingUser(null); }}
                        okText="保存"
                        cancelText="取消"
                        maskClosable={false}
                        width={600}
                    >
                        {editingUser && (
                            <div style={{ marginTop: 16 }}>
                                <Descriptions column={2} size="small" bordered style={{ marginBottom: 16 }}>
                                    <Descriptions.Item label="用户名">{editingUser.username}</Descriptions.Item>
                                    <Descriptions.Item label="姓名">{editingUser.name}</Descriptions.Item>
                                    <Descriptions.Item label="当前角色" span={2}>
                                        <Tag color={ROLE_MAP[editingUser.role].color}>{ROLE_MAP[editingUser.role].label}</Tag>
                                    </Descriptions.Item>
                                </Descriptions>
                                <Form form={editRoleForm} layout="vertical">
                                    <Form.Item name="newRole" label="新角色" rules={[{ required: true }]}>
                                        <Select>
                                            <Option value="admin">系统管理员</Option>
                                            <Option value="pm">产品经理</Option>
                                            <Option value="tester">测试人员</Option>
                                        </Select>
                                    </Form.Item>
                                </Form>
                                <Divider orientation="left" plain>权限预览</Divider>
                                <Form.Item noStyle shouldUpdate>
                                    {() => {
                                        const newRole = editRoleForm.getFieldValue("newRole");
                                        const preview = rolePermissionPreview(newRole);
                                        return (
                                            <Table
                                                size="small"
                                                pagination={false}
                                                rowKey="key"
                                                columns={[
                                                    { title: "能力点", dataIndex: "label", width: 200 },
                                                    {
                                                        title: "权限", dataIndex: "value", width: 100, align: "center",
                                                        render: (val, record) => <PermIcon value={val} tip={record.tip} />
                                                    }
                                                ]}
                                                dataSource={preview}
                                            />
                                        );
                                    }}
                                </Form.Item>
                            </div>
                        )}
                    </Modal>

                    {/* Help Drawer */}
                    <Drawer
                        title={
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                <span>页面逻辑说明</span>
                                <Tooltip title={drawerWidth === 1200 ? "切换到窄视图" : "切换到宽视图"}>
                                    <Button
                                        type="text"
                                        icon={<ColumnWidthOutlined />}
                                        onClick={toggleDrawerWidth}
                                        size="small"
                                    >
                                        {drawerWidth === 1200 ? "800px" : "1200px"}
                                    </Button>
                                </Tooltip>
                            </div>
                        }
                        width={drawerWidth}
                        open={drawerVisible}
                        onClose={() => setDrawerVisible(false)}
                    >
                        <Tabs items={drawerTabs} />
                    </Drawer>
                </Layout>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
