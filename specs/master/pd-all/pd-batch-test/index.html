<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话方案批量测试 | SmartChef PD</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/antd@6.3.1/dist/reset.css">
    <link rel="stylesheet" href="https://unpkg.com/antd@6.3.1/dist/antd.css">
    <script src="https://unpkg.com/antd@6.3.1/dist/antd.min.js"></script>
    <script src="https://unpkg.com/@ant-design/icons@5.3.7/dist/index.umd.min.js"></script>
    <script src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }

        .page-layout { min-height: 100vh; }
        .sidebar { background: #001529; color: #fff; position: fixed; height: 100vh; overflow: auto; }
        .sidebar-header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo { font-size: 18px; font-weight: 600; }
        .sidebar-subtitle { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }

        .main-content { margin-left: 260px; padding: 24px 32px; }
        .main-content-no-sider { margin-left: 0 !important; }
        .page-header { background: #fff; padding: 24px 32px; margin: -24px -32px 24px; border-bottom: 1px solid #f0f0f0; }

        .drawer-section { margin-bottom: 24px; }
        .drawer-section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #262626; border-left: 4px solid #1890ff; padding-left: 12px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        mermaid.initialize({
            startOnLoad: false,
            theme: "default",
            flowchart: { useMaxWidth: true, htmlLabels: true, curve: "basis" }
        });

        const { useState, useMemo, useCallback, useEffect } = React;
        const antd = window.antd;
        const icons = window.icons;
        const {
            Layout, Menu, Button, Table, Tag, Alert, Card, Input, Select, Space,
            Drawer, Tabs, List, message, Statistic, Row, Col, Tooltip, Badge, Modal,
            Form, InputNumber, Radio, Upload, Steps, Spin
        } = antd;
        const {
            SettingOutlined, DatabaseOutlined, FileTextOutlined, RobotOutlined,
            MessageOutlined, ExperimentOutlined, RocketOutlined, UserOutlined,
            BarChartOutlined, SearchOutlined, PlusOutlined, QuestionCircleOutlined,
            ColumnWidthOutlined, CheckCircleOutlined, CloseCircleOutlined,
            SyncOutlined, DeleteOutlined, EyeOutlined, ReloadOutlined,
            InboxOutlined, DownloadOutlined, LoadingOutlined,
            ExclamationCircleOutlined, ClockCircleOutlined, ThunderboltOutlined
        } = icons;

        const { Sider, Content } = Layout;
        const { Option } = Select;
        const { Dragger } = Upload;

        // ── Mock Data ──

        const mockProfiles = [
            { id: "prof_001", name: "生产方案-中英双语" },
            { id: "prof_002", name: "测试方案-千问" },
            { id: "prof_003", name: "实验方案-知识优先" }
        ];

        const mockIntents = [
            { key: "set_timer", label: "设置定时器" },
            { key: "adjust_temp", label: "调节温度" },
            { key: "start_recipe", label: "启动菜谱" },
            { key: "stop_cooking", label: "停止烹饪" },
            { key: "query_status", label: "查询状态" },
            { key: "set_mode", label: "设置模式" }
        ];

        const mockBatches = [
            { id: "batch_001", name: "指令全量回归 v2.1", profile: "生产方案-中英双语", caseCount: 200, status: "completed", passed: true, accuracy: 96.2, avgLatency: 145, createdAt: "2026-03-17 14:00" },
            { id: "batch_002", name: "新增意图验证", profile: "测试方案-千问", caseCount: 50, status: "completed", passed: false, accuracy: 88.0, avgLatency: 168, createdAt: "2026-03-16 10:00" },
            { id: "batch_003", name: "英文指令回归", profile: "生产方案-中英双语", caseCount: 80, status: "completed", passed: true, accuracy: 95.0, avgLatency: 132, createdAt: "2026-03-15 09:00" },
            { id: "batch_004", name: "知识库菜谱测试", profile: "实验方案-知识优先", caseCount: 100, status: "running", passed: null, accuracy: null, avgLatency: null, createdAt: "2026-03-18 08:30" },
            { id: "batch_005", name: "闲聊质量测试", profile: "生产方案-中英双语", caseCount: 30, status: "completed", passed: false, accuracy: 80.0, avgLatency: 2450, createdAt: "2026-03-14 15:00" },
            { id: "batch_006", name: "槽位填充验证", profile: "测试方案-千问", caseCount: 60, status: "completed", passed: true, accuracy: 97.5, avgLatency: 120, createdAt: "2026-03-13 16:00" },
            { id: "batch_007", name: "多轮对话回归", profile: "生产方案-中英双语", caseCount: 45, status: "completed", passed: true, accuracy: 94.0, avgLatency: 198, createdAt: "2026-03-12 11:00" },
            { id: "batch_008", name: "边界用例测试", profile: "实验方案-知识优先", caseCount: 25, status: "pending", passed: null, accuracy: null, avgLatency: null, createdAt: "2026-03-18 09:00" }
        ];

        const STATUS_MAP = {
            pending:   { color: "default", text: "待执行", icon: null },
            running:   { color: "processing", text: "执行中", icon: React.createElement(SyncOutlined, { spin: true }) },
            completed: { color: "success", text: "已完成", icon: null },
            failed:    { color: "error", text: "失败", icon: null }
        };

        // ── App ──

        function App() {
            const inIframe = typeof window !== "undefined" && window.self !== window.top;
            const [selectedKeys, setSelectedKeys] = useState(["batch-test"]);
            const [openKeys, setOpenKeys] = useState(["testing"]);
            const [drawerVisible, setDrawerVisible] = useState(false);
            const [drawerWidth, setDrawerWidth] = useState(1200);
            const [filters, setFilters] = useState({ name: "", profile: undefined, status: undefined, passStatus: undefined });
            const [pagination, setPagination] = useState({ current: 1, pageSize: 10, total: mockBatches.length });

            const [modalVisible, setModalVisible] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);
            const [form] = Form.useForm();
            const [caseSource, setCaseSource] = useState("auto");

            // ── Derived ──

            const filteredData = useMemo(() => {
                return mockBatches.filter(b => {
                    if (filters.name && !b.name.includes(filters.name) && !b.id.includes(filters.name)) return false;
                    if (filters.profile && b.profile !== filters.profile) return false;
                    if (filters.status && b.status !== filters.status) return false;
                    if (filters.passStatus === "passed" && b.passed !== true) return false;
                    if (filters.passStatus === "failed" && b.passed !== false) return false;
                    return true;
                });
            }, [filters]);

            const stats = useMemo(() => ({
                total: mockBatches.length,
                completed: mockBatches.filter(b => b.status === "completed").length,
                running: mockBatches.filter(b => b.status === "running").length,
                belowThreshold: mockBatches.filter(b => b.passed === false).length
            }), []);

            // ── Navigation ──

            const goTo = (page) => {
                const map = {
                    "libraries": "../pd-intent-library/index.html",
                    "datasets": "../pd-intent-library/datasets.html",
                    "profiles": "../pd-dialog-profile/index.html",
                    "manual-test": "../pd-dialog-profile/test-chat.html",
                    "batch-test": "index.html",
                    "monitoring": "../pd-monitoring/index.html",
                    "knowledge": "../pd-knowledge-base/index.html"
                };
                if (map[page]) window.location.href = map[page];
            };

            const handleOpenChange = useCallback((keys) => {
                setOpenKeys(keys);
            }, []);

            const toggleDrawerWidth = () => {
                setDrawerWidth(prev => prev === 1200 ? 800 : 1200);
            };

            // ── Mermaid rendering ──

            useEffect(() => {
                if (drawerVisible) {
                    setTimeout(() => {
                        mermaid.init(undefined, document.querySelectorAll(".mermaid"));
                    }, 500);
                }
            }, [drawerVisible]);

            // ── Modal helpers ──

            const openCreateModal = () => {
                form.resetFields();
                form.setFieldsValue({ accuracyThreshold: 95, latencyThreshold: 200 });
                setCurrentStep(0);
                setCaseSource("auto");
                setModalVisible(true);
            };

            const handleModalOk = () => {
                if (currentStep === 0) {
                    form.validateFields(["name", "profile", "accuracyThreshold", "latencyThreshold"]).then(() => {
                        setCurrentStep(1);
                    }).catch(() => {});
                    return;
                }
                message.success("测试批次创建成功");
                setModalVisible(false);
                form.resetFields();
                setCurrentStep(0);
            };

            const handleModalBack = () => {
                if (currentStep === 1) setCurrentStep(0);
            };

            const handleDelete = (record) => {
                Modal.confirm({
                    title: "删除确认",
                    icon: React.createElement(ExclamationCircleOutlined),
                    content: React.createElement("span", null, "确定删除批次 ", React.createElement("strong", null, record.name), "？此操作不可恢复。"),
                    okText: "确认删除",
                    okType: "danger",
                    cancelText: "取消",
                    maskClosable: false,
                    onOk: () => message.success("批次已删除：" + record.name)
                });
            };

            const handleRerun = (record) => {
                Modal.confirm({
                    title: "重新执行",
                    icon: React.createElement(ReloadOutlined),
                    content: React.createElement("span", null, "确定重新执行批次 ", React.createElement("strong", null, record.name), "？历史结果将被覆盖。"),
                    okText: "确认执行",
                    cancelText: "取消",
                    onOk: () => message.success("批次已提交重新执行：" + record.name)
                });
            };

            // ── Columns ──

            const columns = [
                {
                    title: "批次名称",
                    key: "name",
                    width: 200,
                    render: (_, record) => (
                        React.createElement("div", null,
                            React.createElement("a", { href: "detail.html?id=" + record.id, style: { fontWeight: 500 } }, record.name),
                            React.createElement("div", { style: { fontSize: 12, color: "#8c8c8c", fontFamily: "monospace" } }, record.id)
                        )
                    )
                },
                {
                    title: "关联方案",
                    dataIndex: "profile",
                    key: "profile",
                    width: 160
                },
                {
                    title: "用例数",
                    dataIndex: "caseCount",
                    key: "caseCount",
                    width: 80,
                    align: "center"
                },
                {
                    title: "执行状态",
                    key: "status",
                    width: 100,
                    render: (_, record) => {
                        const cfg = STATUS_MAP[record.status];
                        return React.createElement(Tag, { color: cfg.color, icon: cfg.icon }, cfg.text);
                    }
                },
                {
                    title: "达标",
                    key: "passed",
                    width: 90,
                    align: "center",
                    render: (_, record) => {
                        if (record.passed === true) return React.createElement(Tag, { color: "success" }, "达标");
                        if (record.passed === false) return React.createElement(Tag, { color: "error" }, "未达标");
                        return React.createElement(Tag, { color: "default" }, "待执行");
                    }
                },
                {
                    title: "准确率",
                    key: "accuracy",
                    width: 90,
                    align: "center",
                    render: (_, record) => {
                        if (record.accuracy === null) return React.createElement("span", { style: { color: "#bfbfbf" } }, "-");
                        const color = record.accuracy >= 95 ? "#52c41a" : record.accuracy >= 90 ? "#faad14" : "#ff4d4f";
                        return React.createElement("span", { style: { color: color, fontWeight: 600, fontFamily: "monospace" } }, record.accuracy.toFixed(1) + "%");
                    }
                },
                {
                    title: "平均耗时",
                    key: "avgLatency",
                    width: 100,
                    align: "center",
                    render: (_, record) => {
                        if (record.avgLatency === null) return React.createElement("span", { style: { color: "#bfbfbf" } }, "-");
                        const color = record.avgLatency <= 200 ? "#52c41a" : record.avgLatency <= 500 ? "#faad14" : "#ff4d4f";
                        return React.createElement("span", { style: { color: color, fontFamily: "monospace" } }, record.avgLatency + "ms");
                    }
                },
                {
                    title: "创建时间",
                    dataIndex: "createdAt",
                    key: "createdAt",
                    width: 160
                },
                {
                    title: "操作",
                    key: "action",
                    width: 220,
                    fixed: "right",
                    render: (_, record) => (
                        React.createElement(Space, null,
                            React.createElement(Button, { type: "link", size: "small", icon: React.createElement(EyeOutlined), onClick: () => { window.location.href = "detail.html?id=" + record.id; } }, "查看详情"),
                            React.createElement(Tooltip, { title: record.status === "running" ? "执行中不可重新执行" : "" },
                                React.createElement(Button, { type: "link", size: "small", icon: React.createElement(ReloadOutlined), disabled: record.status === "running", onClick: () => handleRerun(record) }, "重新执行")
                            ),
                            React.createElement(Tooltip, { title: record.status === "running" ? "执行中不可删除" : "" },
                                React.createElement(Button, { type: "link", size: "small", danger: true, icon: React.createElement(DeleteOutlined), disabled: record.status === "running", onClick: () => handleDelete(record) }, "删除")
                            )
                        )
                    )
                }
            ];

            // ── Menu ──

            const menuItems = [
                {
                    key: "config",
                    icon: React.createElement(SettingOutlined),
                    label: "配置管理",
                    children: [
                        { key: "libraries", icon: React.createElement(DatabaseOutlined), label: "指令库管理", onClick: () => goTo("libraries") },
                        { key: "datasets", icon: React.createElement(FileTextOutlined), label: "数据集管理", onClick: () => goTo("datasets") },
                        { key: "profiles", icon: React.createElement(RobotOutlined), label: "对话方案", onClick: () => goTo("profiles") }
                    ]
                },
                {
                    key: "testing",
                    icon: React.createElement(ExperimentOutlined),
                    label: "测试验证",
                    children: [
                        { key: "manual-test", icon: React.createElement(MessageOutlined), label: "手动测试", onClick: () => goTo("manual-test") },
                        { key: "batch-test", icon: React.createElement(ThunderboltOutlined), label: "批量测试（方案）" }
                    ]
                },
                {
                    key: "system",
                    icon: React.createElement(UserOutlined),
                    label: "系统管理",
                    children: [
                        { key: "versions", icon: React.createElement(RocketOutlined), label: "版本管理" },
                        { key: "users", icon: React.createElement(UserOutlined), label: "用户管理" },
                        { key: "monitoring", icon: React.createElement(BarChartOutlined), label: "监控仪表盘", onClick: () => goTo("monitoring") }
                    ]
                }
            ];

            // ── Case source panel ──

            const renderCaseSource = () => {
                if (caseSource === "auto") {
                    return React.createElement("div", { style: { marginTop: 16 } },
                        React.createElement(Form.Item, { label: "覆盖意图", name: "coverIntents" },
                            React.createElement(Select, { mode: "multiple", placeholder: "选择需要覆盖的意图（留空则覆盖全部）", allowClear: true },
                                mockIntents.map(i => React.createElement(Option, { key: i.key, value: i.key }, i.label))
                            )
                        ),
                        React.createElement(Form.Item, { label: "每意图用例数", name: "casesPerIntent", initialValue: 10 },
                            React.createElement(InputNumber, { min: 1, max: 50, style: { width: "100%" } })
                        ),
                        React.createElement(Button, { type: "primary", icon: React.createElement(ThunderboltOutlined), onClick: () => message.success("已基于当前配置生成测试用例") }, "生成")
                    );
                }
                if (caseSource === "upload") {
                    return React.createElement("div", { style: { marginTop: 16 } },
                        React.createElement(Dragger, {
                            accept: ".xlsx,.csv",
                            maxCount: 1,
                            beforeUpload: () => { message.success("文件已上传"); return false; }
                        },
                            React.createElement("p", { className: "ant-upload-drag-icon" }, React.createElement(InboxOutlined)),
                            React.createElement("p", { className: "ant-upload-text" }, "点击或拖拽文件到此区域上传"),
                            React.createElement("p", { className: "ant-upload-hint" }, "支持 .xlsx 和 .csv 格式，单次限一个文件")
                        ),
                        React.createElement("a", { style: { display: "inline-block", marginTop: 8 }, onClick: () => message.info("模板下载中...") },
                            React.createElement(DownloadOutlined), " 下载用例模板"
                        )
                    );
                }
                return React.createElement(Alert, {
                    message: "稍后在详情页添加",
                    description: "批次创建后，您可以在批次详情页中手动逐条添加测试用例。",
                    type: "info",
                    showIcon: true,
                    style: { marginTop: 16 }
                });
            };

            // ── Drawer tabs ──

            const drawerTabs = [
                {
                    key: "flow",
                    label: "数据流向",
                    children: React.createElement("div", null,
                        React.createElement("div", { className: "drawer-section" },
                            React.createElement("div", { className: "drawer-section-title" }, "批量测试全链路数据流向"),
                            React.createElement("pre", { style: { background: "#f5f5f5", padding: 16, borderRadius: 4, overflow: "auto", fontSize: 13, lineHeight: 1.8 } },
                                "[创建批次]  配置基础信息与性能指标\n" +
                                "    ├─ 批次名称、关联方案\n" +
                                "    ├─ 准确率阈值、延迟阈值\n" +
                                "    └─ 用例来源选择\n" +
                                "           ↓\n" +
                                "[生成/上传用例]  测试数据准备\n" +
                                "    ├─ 自动生成: 基于方案绑定的意图自动产出用例\n" +
                                "    ├─ 上传 Excel: 按模板格式导入\n" +
                                "    └─ 手动添加: 在详情页逐条编辑\n" +
                                "           ↓\n" +
                                "[执行测试]  NLU Pipeline 逐条跑测\n" +
                                "    ├─ 每条用例: utterance → 路由 → 意图 → 槽位\n" +
                                "    ├─ 记录: 实际路由/意图/槽位/耗时\n" +
                                "    └─ 逐条判定: pass / fail\n" +
                                "           ↓\n" +
                                "[收集结果]  汇总统计\n" +
                                "    ├─ 准确率 = 通过数 / 总数\n" +
                                "    ├─ 平均耗时 = sum(latency) / 总数\n" +
                                "    └─ 达标判定: 准确率 >= 阈值\n" +
                                "           ↓\n" +
                                "[生成报告]  结果可视化\n" +
                                "           ↓\n" +
                                "[智能分析]  FR-014 低于阈值时自动分析"
                            )
                        ),
                        React.createElement(Alert, {
                            message: "关键数据关系",
                            description: "批次:方案 = N:1（多个批次可关联同一方案）；批次:用例 = 1:N（一个批次包含多条用例）；执行时使用方案的当前配置快照。",
                            type: "info",
                            showIcon: true
                        })
                    )
                },
                {
                    key: "state",
                    label: "状态流转",
                    children: React.createElement("div", null,
                        React.createElement("div", { className: "drawer-section" },
                            React.createElement("div", { className: "drawer-section-title" }, "批次生命周期状态机"),
                            React.createElement("pre", { style: { background: "#f5f5f5", padding: 16, borderRadius: 4, overflow: "auto", fontSize: 13, lineHeight: 1.8 } },
                                "pending ──→ running ──→ completed\n" +
                                "              │              │\n" +
                                "              └──→ failed     └── 可重新执行 → running\n" +
                                "\n" +
                                "批次状态说明:\n" +
                                "  pending   : 已创建，待执行\n" +
                                "  running   : 正在逐条执行测试用例\n" +
                                "  completed : 全部用例执行完成\n" +
                                "  failed    : 执行过程异常中断\n" +
                                "\n" +
                                "用例级别状态:\n" +
                                "  pending → passed   (实际结果与期望匹配)\n" +
                                "  pending → failed   (实际结果与期望不匹配)"
                            ),
                            React.createElement(List, {
                                size: "small",
                                bordered: true,
                                style: { marginTop: 16 },
                                dataSource: [
                                    { rule: "重新执行", desc: "已完成或失败的批次可重新执行，历史结果将被覆盖" },
                                    { rule: "并发限制", desc: "同时只允许 1 个批次处于 running 状态" },
                                    { rule: "达标判定", desc: "准确率 >= 批次设定的阈值时判定为达标" },
                                    { rule: "智能分析", desc: "未达标时自动触发智能分析报告（FR-014）" }
                                ],
                                renderItem: (item) => React.createElement(List.Item, null,
                                    React.createElement(Tag, { color: "blue" }, item.rule), " ", item.desc
                                )
                            })
                        )
                    )
                },
                {
                    key: "fields",
                    label: "字段说明",
                    children: React.createElement("div", null,
                        React.createElement("div", { className: "drawer-section" },
                            React.createElement("div", { className: "drawer-section-title" }, "批次字段详解"),
                            React.createElement(Table, {
                                size: "small",
                                pagination: false,
                                rowKey: "field",
                                columns: [
                                    { title: "字段", dataIndex: "field", width: 140 },
                                    { title: "类型", dataIndex: "type", width: 80 },
                                    { title: "说明", dataIndex: "desc" },
                                    { title: "约束 / 默认值", dataIndex: "constraint", width: 220 }
                                ],
                                dataSource: [
                                    { field: "id", type: "string", desc: "系统自动生成的批次唯一标识", constraint: "只读，格式 batch_XXX" },
                                    { field: "name", type: "string", desc: "批次显示名称", constraint: "必填，最长 100 字符" },
                                    { field: "profile", type: "string", desc: "关联的对话方案名称", constraint: "必选" },
