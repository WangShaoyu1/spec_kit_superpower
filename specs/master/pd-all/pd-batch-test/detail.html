<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话方案批次详情 | SmartChef PD</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/antd@6.3.1/dist/reset.css">
    <link rel="stylesheet" href="https://unpkg.com/antd@6.3.1/dist/antd.css">
    <script src="https://unpkg.com/antd@6.3.1/dist/antd.min.js"></script>
    <script src="https://unpkg.com/@ant-design/icons@5.3.7/dist/index.umd.min.js"></script>
    <script src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
        .page-layout { min-height: 100vh; }
        .sidebar { background: #001529; color: #fff; position: fixed; height: 100vh; overflow: auto; }
        .sidebar-header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo { font-size: 18px; font-weight: 600; }
        .sidebar-subtitle { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
        .main-content { margin-left: 260px; padding: 24px 32px; }
        .main-content-no-sider { margin-left: 0 !important; }
        .page-header { background: #fff; padding: 24px 32px; margin: -24px -32px 24px; border-bottom: 1px solid #f0f0f0; }
        .drawer-section { margin-bottom: 24px; }
        .drawer-section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #262626; border-left: 4px solid #1890ff; padding-left: 12px; }
        .stat-card { text-align: center; padding: 16px 12px; }
        .stat-card .value { font-size: 28px; font-weight: 600; line-height: 1.3; }
        .stat-card .label { font-size: 13px; color: #8c8c8c; margin-top: 4px; }
        .slot-json { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; max-width: 280px; word-break: break-all; }
        .confusion-cell { text-align: center; min-width: 60px; }
        .confusion-cell.highlight { background: #fff1f0; font-weight: 600; color: #ff4d4f; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useMemo, useCallback, useEffect, useRef } = React;
        const antd = window.antd;
        const icons = window.icons;
        const {
            Layout, Menu, Button, Table, Tag, Badge, Alert, Card, Space,
            Modal, Drawer, Tabs, Descriptions, Tooltip, Row, Col, Divider,
            Progress, Select, message, Typography, Statistic, Steps
        } = antd;
        const {
            ArrowLeftOutlined, QuestionCircleOutlined, ReloadOutlined,
            DownloadOutlined, ExperimentOutlined, MessageOutlined,
            RocketOutlined, DatabaseOutlined, FileTextOutlined, RobotOutlined,
            UserOutlined, BarChartOutlined, ColumnWidthOutlined,
            CheckCircleOutlined, CloseCircleOutlined, ExclamationCircleOutlined,
            InfoCircleOutlined, SettingOutlined, WarningOutlined,
            BulbOutlined, AimOutlined, FundOutlined, TableOutlined,
            BugOutlined, ThunderboltOutlined, FilterOutlined
        } = icons;

        const { Sider, Content } = Layout;
        const { Option } = Select;
        const { Text } = Typography;

        // ─── Mock Data ─────────────────────────────────────────────────
        const batchInfo = {
            name: "新增意图验证",
            status: "completed",
            profileName: "生产方案-中英双语",
            totalCases: 50,
            passedCases: 44,
            failedCases: 6,
            accuracy: 88.0,
            targetAccuracy: 95,
            avgLatency: 168,
            targetLatency: 200,
            executedAt: "2026-03-17 15:30:00",
            finishedAt: "2026-03-17 15:32:18",
            passed: false
        };

        const mockCases = [
            { id: "TC-001", utterance: "设置温度180度", expectedRoute: "command", actualRoute: "command", expectedIntent: "set_cooking_temp", actualIntent: "set_cooking_temp", expectedSlots: [{name:"number",value:"180"}], actualSlots: [{name:"number",value:"180"}], score: 0.96, latency: 128, passed: true, source: "auto" },
            { id: "TC-002", utterance: "把火关了", expectedRoute: "command", actualRoute: "command", expectedIntent: "voice_cmd_stop_cooking", actualIntent: "voice_cmd_stop_cooking", expectedSlots: [], actualSlots: [], score: 0.94, latency: 112, passed: true, source: "auto" },
            { id: "TC-003", utterance: "帮我调低一点", expectedRoute: "command", actualRoute: "command", expectedIntent: "decrease_temp", actualIntent: "set_cooking_temp", expectedSlots: [], actualSlots: [{name:"number",value:"null"}], score: 0.42, latency: 155, passed: false, source: "auto" },
            { id: "TC-004", utterance: "红烧肉怎么做", expectedRoute: "knowledge", actualRoute: "command", expectedIntent: null, actualIntent: "search_recipe_by_cuisine_type", expectedSlots: [], actualSlots: [{name:"cuisine",value:"红烧肉"}], score: 0.58, latency: 145, passed: false, source: "manual" },
            { id: "TC-005", utterance: "收藏这个菜谱", expectedRoute: "command", actualRoute: "command", expectedIntent: "collect_recipe", actualIntent: "collect_recipe", expectedSlots: [{name:"recipe_ref",value:"context"}], actualSlots: [{name:"recipe_ref",value:"null"}], score: 0.65, latency: 160, passed: false, source: "auto" },
            { id: "TC-006", utterance: "Start cooking", expectedRoute: "command", actualRoute: "command", expectedIntent: "voice_cmd_start_cooking", actualIntent: "voice_cmd_start_cooking", expectedSlots: [], actualSlots: [], score: 0.91, latency: 135, passed: true, source: "auto" },
            { id: "TC-007", utterance: "今天天气怎么样", expectedRoute: "chitchat", actualRoute: "chitchat", expectedIntent: null, actualIntent: null, expectedSlots: [], actualSlots: [], score: 0.88, latency: 2100, passed: true, source: "auto" },
            { id: "TC-008", utterance: "解冻一下", expectedRoute: "command", actualRoute: "command", expectedIntent: "defrost_food", actualIntent: "set_cooking_time", expectedSlots: [], actualSlots: [{name:"duration",value:"null"}], score: 0.38, latency: 148, passed: false, source: "auto" }
        ];

        const intentRankings = [
            { intent: "voice_cmd_start_cooking", total: 5, passed: 5, accuracy: 100, trend: "good" },
            { intent: "voice_cmd_stop_cooking", total: 4, passed: 4, accuracy: 100, trend: "good" },
            { intent: "set_cooking_temp", total: 8, passed: 7, accuracy: 87.5, trend: "warn" },
            { intent: "collect_recipe", total: 4, passed: 2, accuracy: 50, trend: "bad" },
            { intent: "defrost_food", total: 3, passed: 1, accuracy: 33.3, trend: "bad" },
            { intent: "decrease_temp", total: 3, passed: 0, accuracy: 0, trend: "bad" }
        ];

        const confusionPairs = [
            { from: "decrease_temp", to: "set_cooking_temp", count: 3 },
            { from: "defrost_food", to: "set_cooking_time", count: 2 },
            { from: "search_recipe", to: "collect_recipe", count: 1 }
        ];

        const failureCategories = [
            {
                category: "表达覆盖不足",
                count: 3,
                cases: ["帮我调低一点", "解冻一下"],
                reason: "训练数据未覆盖口语化表达"
            },
            {
                category: "路由错误",
                count: 1,
                cases: ["红烧肉怎么做"],
                reason: "指令优先策略将知识问答误分为指令"
            },
            {
                category: "槽位提取失败",
                count: 2,
                cases: ["收藏这个菜谱"],
                reason: "指代消解在批量测试上下文中不可用"
            }
        ];

        const suggestions = [
            "为 decrease_temp 意图补充口语化训练数据（\"调低一点\"、\"小点火\"等）",
            "为 defrost_food 意图补充简短表达（\"解冻一下\"、\"化冻\"等）",
            "考虑调整 \"红烧肉怎么做\" 的路由策略或添加知识域优先规则",
            "批量测试环境增加模拟上下文支持（解决指代消解问题）",
            "建议在指令库中补充同义词和变体表达后重新训练"
        ];

        // ─── Helpers ───────────────────────────────────────────────────
        function renderSlotJson(slots) {
            if (!slots || slots.length === 0) return <Text type="secondary">-</Text>;
            const text = JSON.stringify(slots);
            return (
                <Tooltip title={<pre style={{ margin: 0, fontSize: 12, whiteSpace: "pre-wrap" }}>{JSON.stringify(slots, null, 2)}</pre>}>
                    <span className="slot-json">{text.length > 30 ? text.slice(0, 30) + "..." : text}</span>
                </Tooltip>
            );
        }

        function slotsMatch(expected, actual) {
            return JSON.stringify(expected) === JSON.stringify(actual);
        }

        // ─── App ────────────────────────────────────────────────────────
        function App() {
            const inIframe = typeof window !== "undefined" && window.self !== window.top;
            const [openKeys, setOpenKeys] = useState(["testing"]);
            const [drawerVisible, setDrawerVisible] = useState(false);
            const [drawerWidth, setDrawerWidth] = useState(1200);
            const [filterPassed, setFilterPassed] = useState(null);
            const [filterRoute, setFilterRoute] = useState(null);
            const [filterIntent, setFilterIntent] = useState(null);
            const [analysisTab, setAnalysisTab] = useState("summary");

            useEffect(() => {
                if (window.mermaid) {
                    window.mermaid.initialize({ startOnLoad: false, theme: "default" });
                }
            }, []);

            useEffect(() => {
                if (!drawerVisible || !window.mermaid) return;
                const timer = setTimeout(() => {
                    document.querySelectorAll(".mermaid-pending").forEach(el => {
                        const id = "mermaid-" + Math.random().toString(36).slice(2, 9);
                        window.mermaid.render(id, el.textContent).then(({ svg }) => {
                            el.innerHTML = svg;
                            el.classList.remove("mermaid-pending");
                        }).catch(() => {});
                    });
                }, 400);
                return () => clearTimeout(timer);
            }, [drawerVisible]);

            const handleOpenChange = useCallback((keys) => {
                setOpenKeys(keys);
            }, []);

            const toggleDrawerWidth = () => {
                setDrawerWidth(prev => prev === 1200 ? 800 : 1200);
            };

            const filteredCases = useMemo(() => {
                return mockCases.filter(c => {
                    if (filterPassed !== null && c.passed !== filterPassed) return false;
                    if (filterRoute && c.expectedRoute !== filterRoute) return false;
                    if (filterIntent && c.expectedIntent !== filterIntent && c.actualIntent !== filterIntent) return false;
                    return true;
                });
            }, [filterPassed, filterRoute, filterIntent]);

            const allIntents = useMemo(() => {
                const set = new Set();
                mockCases.forEach(c => {
                    if (c.expectedIntent) set.add(c.expectedIntent);
                    if (c.actualIntent) set.add(c.actualIntent);
                });
                return Array.from(set).sort();
            }, []);

            const confusionMatrix = useMemo(() => {
                const intents = ["set_cooking_temp", "voice_cmd_stop_cooking", "decrease_temp", "set_cooking_time", "defrost_food", "collect_recipe", "search_recipe_by_cuisine_type"];
                const matrix = {};
                intents.forEach(from => {
                    matrix[from] = {};
                    intents.forEach(to => { matrix[from][to] = 0; });
                });
                confusionPairs.forEach(p => {
                    if (matrix[p.from] && matrix[p.from][p.to] !== undefined) {
                        matrix[p.from][p.to] = p.count;
                    }
                });
                return { intents, matrix };
            }, []);

            const caseColumns = [
                {
                    title: "用例编号", dataIndex: "id", key: "id", width: 100, fixed: "left",
                    render: (text) => <Text code style={{ fontFamily: "SFMono-Regular, Consolas, monospace" }}>{text}</Text>
                },
                {
                    title: "用例语句", dataIndex: "utterance", key: "utterance", width: 160, fixed: "left",
                    ellipsis: true,
                    render: (text) => <Tooltip title={text}><span>{text}</span></Tooltip>
                },
                {
                    title: "预期路由", dataIndex: "expectedRoute", key: "expectedRoute", width: 100,
                    render: (v) => <Tag color={v === "command" ? "blue" : v === "knowledge" ? "purple" : "cyan"}>{v}</Tag>
                },
                {
                    title: "实际路由", key: "actualRoute", width: 100,
                    render: (_, r) => {
                        const match = r.expectedRoute === r.actualRoute;
                        return <Tag color={match ? "green" : "red"}>{r.actualRoute}</Tag>;
                    }
                },
                {
                    title: "预期意图", dataIndex: "expectedIntent", key: "expectedIntent", width: 170,
                    ellipsis: true,
                    render: (v) => v ? <Text code style={{ fontSize: 12 }}>{v}</Text> : <Text type="secondary">-</Text>
                },
                {
                    title: "实际意图", key: "actualIntent", width: 170,
                    ellipsis: true,
                    render: (_, r) => {
                        if (!r.actualIntent) return <Text type="secondary">-</Text>;
                        const match = r.expectedIntent === r.actualIntent;
                        return <Text code style={{ fontSize: 12, color: match ? "#52c41a" : "#ff4d4f", background: match ? "#f6ffed" : "#fff1f0" }}>{r.actualIntent}</Text>;
                    }
                },
                {
                    title: "预期槽位", key: "expectedSlots", width: 120,
                    render: (_, r) => renderSlotJson(r.expectedSlots)
                },
                {
                    title: "实际槽位", key: "actualSlots", width: 120,
                    render: (_, r) => {
                        const match = slotsMatch(r.expectedSlots, r.actualSlots);
                        return (
                            <span style={{ color: match ? undefined : "#ff4d4f" }}>
                                {renderSlotJson(r.actualSlots)}
                            </span>
                        );
                    }
                },
                {
                    title: "匹配得分", dataIndex: "score", key: "score", width: 130,
                    sorter: (a, b) => a.score - b.score,
                    render: (v) => {
                        const pct = Math.round(v * 100);
                        const color = pct >= 90 ? "#52c41a" : pct >= 70 ? "#faad14" : "#ff4d4f";
                        return <Progress percent={pct} size="small" strokeColor={color} format={() => `${pct}%`} />;
                    }
                },
                {
                    title: "响应耗时", dataIndex: "latency", key: "latency", width: 100,
                    sorter: (a, b) => a.latency - b.latency,
                    render: (v) => {
                        const color = v <= 200 ? "green" : v <= 500 ? "orange" : "red";
                        return <Tag color={color}>{v}ms</Tag>;
                    }
                },
                {
                    title: "达标", dataIndex: "passed", key: "passed", width: 70,
                    render: (v) => v ? <Tag color="success">&#10004;</Tag> : <Tag color="error">&#10008;</Tag>
                },
                {
                    title: "标记", dataIndex: "source", key: "source", width: 110,
                    render: (v) => <Tag color={v === "auto" ? "default" : "orange"}>{v === "auto" ? "auto-generated" : "manually-adjusted"}</Tag>
                }
            ];

            const intentRankColumns = [
                {
                    title: "意图", dataIndex: "intent", key: "intent",
                    render: (v) => <Text code>{v}</Text>
                },
                { title: "测试数", dataIndex: "total", key: "total", width: 80 },
                { title: "通过", dataIndex: "passed", key: "passed", width: 80 },
                {
                    title: "准确率", dataIndex: "accuracy", key: "accuracy", width: 140,
                    sorter: (a, b) => a.accuracy - b.accuracy,
                    defaultSortOrder: "descend",
                    render: (v) => {
                        const color = v >= 90 ? "#52c41a" : v >= 70 ? "#faad14" : "#ff4d4f";
                        return <Progress percent={v} size="small" strokeColor={color} format={() => `${v}%`} />;
                    }
                },
                {
                    title: "趋势", dataIndex: "trend", key: "trend", width: 80,
                    render: (v) => v === "good"
                        ? <Tag color="success"><CheckCircleOutlined /> &#10004;</Tag>
                        : v === "warn"
                            ? <Tag color="warning"><ExclamationCircleOutlined /> &#9888;</Tag>
                            : <Tag color="error"><CloseCircleOutlined /> &#10008;</Tag>
                }
            ];

            const menuItems = [
                {
                    key: "config", icon: <SettingOutlined />, label: "配置管理",
                    children: [
                        { key: "libraries", icon: <DatabaseOutlined />, label: "指令库管理" },
                        { key: "datasets", icon: <FileTextOutlined />, label: "数据集管理" },
                        { key: "profiles", icon: <RobotOutlined />, label: "对话方案" }
                    ]
                },
                {
                    key: "testing", icon: <ExperimentOutlined />, label: "测试验证",
                    children: [
                        { key: "manual-test", icon: <MessageOutlined />, label: "手动测试" },
                        { key: "batch-test", icon: <ExperimentOutlined />, label: "批量测试（方案）" }
                    ]
                },
                {
                    key: "system", icon: <UserOutlined />, label: "系统管理",
                    children: [
                        { key: "versions", icon: <RocketOutlined />, label: "版本管理" },
                        { key: "users", icon: <UserOutlined />, label: "用户管理" },
                        { key: "monitoring", icon: <BarChartOutlined />, label: "监控仪表盘" }
                    ]
                }
            ];

            // ─── Render ─────────────────────────────────────────────────
            return (
                <Layout className="page-layout">
                    {!inIframe && (
                    <Sider trigger={null} width={260} className="sidebar">
                        <div className="sidebar-header">
                            <div className="sidebar-logo">SmartChef</div>
                            <div className="sidebar-subtitle">智能对话管理平台</div>
                        </div>
                        <Menu theme="dark" mode="inline" selectedKeys={["batch-test"]} openKeys={openKeys} onOpenChange={handleOpenChange} items={menuItems} />
                    </Sider>
                    )}

                    <Content className={"main-content" + (inIframe ? " main-content-no-sider" : "")}>
                        {/* Page Header */}
                        <div className="page-header">
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                                <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                                    <Button icon={<ArrowLeftOutlined />} onClick={() => window.location.href = "index.html"}>返回</Button>
                                    <div>
                                        <h1 style={{ fontSize: 22, fontWeight: 600, margin: 0, display: "flex", alignItems: "center", gap: 8 }}>
                                            对话方案批次详情: {batchInfo.name}
                                            <Tag color="red">未达标</Tag>
                                        </h1>
                                    </div>
                                </div>
                                <Space>
                                    <Button icon={<QuestionCircleOutlined />} onClick={() => setDrawerVisible(true)}>说明</Button>
                                    <Button icon={<ReloadOutlined />} onClick={() => message.info("重新执行批次...")}>重新执行</Button>
                                    <Button type="primary" icon={<DownloadOutlined />} onClick={() => message.success("报告已导出")}>导出报告</Button>
                                </Space>
                            </div>
                        </div>

                        {/* Section 1: Batch Summary */}
                        <Card title="批次概览" style={{ marginBottom: 24 }}>
                            <Row gutter={[16, 16]}>
                                <Col span={6}>
                                    <div className="stat-card">
                                        <div className="label">关联方案</div>
                                        <div style={{ fontSize: 16, fontWeight: 600, marginTop: 8, color: "#1890ff" }}>{batchInfo.profileName}</div>
                                    </div>
                                </Col>
                                <Col span={6}>
                                    <div className="stat-card">
                                        <div className="value" style={{ color: "#262626" }}>{batchInfo.totalCases}</div>
                                        <div className="label">用例总数</div>
                                    </div>
                                </Col>
                                <Col span={6}>
                                    <div className="stat-card">
                                        <div className="value" style={{ color: "#52c41a" }}>{batchInfo.passedCases}</div>
                                        <div className="label">通过数</div>
                                    </div>
                                </Col>
                                <Col span={6}>
                                    <div className="stat-card">
                                        <div className="value" style={{ color: "#ff4d4f" }}>{batchInfo.failedCases}</div>
                                        <div className="label">失败数</div>
                                    </div>
                                </Col>
                            </Row>
                            <Divider style={{ margin: "16px 0" }} />
                            <Row gutter={[16, 16]}>
                                <Col span={6}>
                                    <div className="stat-card">
                                        <div className="value" style={{ color: batchInfo.accuracy >= batchInfo.targetAccuracy ? "#52c41a" : "#ff4d4f" }}>
                                            {batchInfo.accuracy}%
                                        </div>
                                        <div className="label">
                                            准确率
                                            <Tag color={batchInfo.accuracy >= batchInfo.targetAccuracy ? "green" : "red"} style={{ marginLeft: 4, fontSize: 11 }}>
                                                目标 &ge;{batchInfo.targetAccuracy}%
                                            </Tag>
                                        </div>
                                    </div>
                                </Col>
                                <Col span={6}>
                                    <div className="stat-card">
                                        <div className="value" style={{ color: batchInfo.avgLatency <= batchInfo.targetLatency ? "#52c41a" : "#ff4d4f" }}>
                                            {batchInfo.avgLatency}ms
                                        </div>
                                        <div className="label">
                                            平均耗时
                                            <Tag color={batchInfo.avgLatency <= batchInfo.targetLatency ? "green" : "red"} style={{ marginLeft: 4, fontSize: 11 }}>
                                                目标 &le;{batchInfo.targetLatency}ms
                                            </Tag>
                                        </div>
                                    </div>
                                </Col>
                                <Col span={6}>
                                    <div className="stat-card">
                                        <div style={{ fontSize: 14, fontWeight: 500, marginTop: 4 }}>{batchInfo.executedAt}</div>
                                        <div className="label">执行时间</div>
                                    </div>
                                </Col>
                                <Col span={6}>
                                    <div className="stat-card">
                                        <Tag color="red" style={{ fontSize: 14, padding: "4px 12px" }}>
                                            <CloseCircleOutlined style={{ marginRight: 4 }} />未达标
                                        </Tag>
                                        <div className="label" style={{ marginTop: 8 }}>达标状态</div>
                                    </div>
                                </Col>
                            </Row>
                        </Card>

                        {/* Section 2: Test Results Table */}
                        <Card
                            title={
                                <Space>
                                    <span>测试结果明细</span>
                                    <Badge count={filteredCases.length} style={{ backgroundColor: "#1890ff" }} />
                                </Space>
                            }
                            style={{ marginBottom: 24 }}
                            extra={
                                <Space wrap>
                                    <Select
                                        placeholder="达标状态"
                                        allowClear
                                        style={{ width: 120 }}
                                        value={filterPassed}
                                        onChange={setFilterPassed}
                                    >
                                        <Option value={true}>达标</Option>
                                        <Option value={false}>未达标</Option>
                                    </Select>
                                    <Select
                                        placeholder="路由类型"
                                        allowClear
                                        style={{ width: 120 }}
                                        value={filterRoute}
                                        onChange={setFilterRoute}
                                    >
                                        <Option value="command">command</Option>
                                        <Option value="knowledge">knowledge</Option>
                                        <Option value="chitchat">chitchat</Option>
                                    </Select>
                                    <Select
                                        placeholder="意图名称"
                                        allowClear
                                        showSearch
                                        style={{ width: 200 }}
                                        value={filterIntent}
                                        onChange={setFilterIntent}
                                    >
                                        {allIntents.map(i => <Option key={i} value={i}>{i}</Option>)}
                                    </Select>
                                </Space>
                            }
                        >
                            <Table

                                        <Alert
                                            message="批量测试 vs 交互测试的上下文差异"
                                            description="批量测试为单轮执行，不支持多轮对话上下文。依赖指代消解（如'这个菜谱'）的用例在批量测试中天然无法正确提取槽位。不要将此类失败简单归因为模型问题。"
                                            type="error"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="重新执行会覆盖历史结果"
                                            description="点击'重新执行'后，之前的测试结果将被完全覆盖，无法恢复。如需保留历史结果用于对比，请先导出报告。"
                                            type="error"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="手动调整用例会影响统计数据"
                                            description="修改用例的预期值（expectedRoute / expectedIntent / expectedSlots）后，passed 状态会重新计算，进而影响整体准确率和分析报告。source 字段会自动从 auto 变为 manually-adjusted。"
                                            type="warning"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="latency 受环境影响"
                                            description="批量测试中的响应耗时受服务器负载、网络状况等因素影响。单条耗时异常不一定代表模型性能问题，应关注整体平均值和 P95/P99。"
                                            type="warning"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="混淆矩阵仅统计 failed 用例"
                                            description="混淆矩阵只展示失败用例的意图误分类情况。通过的用例即使匹配分数较低也不会出现在混淆矩阵中。"
                                            type="info"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="准确率目标来源于方案配置"
                                            description="达标判断的准确率目标（如 95%）和耗时目标（如 200ms）来源于关联方案的配置。不同方案可能有不同的达标阈值。"
                                            type="info"
                                            showIcon
                                        />
                                    </div>
                                )
                            }
                        ]} />
                    </Drawer>
                </Layout>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
