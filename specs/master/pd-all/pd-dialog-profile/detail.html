<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话方案详情 | SmartChef PD</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/antd@6.3.1/dist/reset.css">
    <link rel="stylesheet" href="https://unpkg.com/antd@6.3.1/dist/antd.css">
    <script src="https://unpkg.com/antd@6.3.1/dist/antd.min.js"></script>
    <script src="https://unpkg.com/@ant-design/icons@5.3.7/dist/index.umd.min.js"></script>
    <script src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
        .page-layout { min-height: 100vh; }
        .sidebar { background: #001529; color: #fff; position: fixed; height: 100vh; overflow: auto; }
        .sidebar-header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo { font-size: 18px; font-weight: 600; }
        .sidebar-subtitle { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
        .main-content { margin-left: 260px; padding: 24px 32px; }
        .main-content-no-sider { margin-left: 0 !important; }
        .page-header { background: #fff; padding: 24px 32px; margin: -24px -32px 24px; border-bottom: 1px solid #f0f0f0; }
        .compare-card { padding: 20px; border-radius: 8px; text-align: center; }
        .compare-card.old { background: #f5f5f5; border: 1px solid #d9d9d9; }
        .compare-card.new { background: #f6ffed; border: 2px solid #52c41a; }
        .compare-value { font-size: 36px; font-weight: 600; }
        .drawer-section { margin-bottom: 24px; }
        .drawer-section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #262626; border-left: 4px solid #1890ff; padding-left: 12px; }
        .persona-card { padding: 20px; border-radius: 8px; border: 1px solid #d9d9d9; background: #fff; position: relative; }
        .persona-card.active { border: 2px solid #1890ff; background: #e6f7ff; }
        .persona-card .persona-badge { position: absolute; top: -1px; right: -1px; background: #1890ff; color: #fff; padding: 2px 10px; border-radius: 0 8px 0 8px; font-size: 12px; }
        .checklist-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; }
        .checklist-item.pass { color: #52c41a; }
        .checklist-item.fail { color: #ff4d4f; }
        .impact-stat { text-align: center; padding: 16px; background: #fff7e6; border: 1px solid #ffd591; border-radius: 8px; }
        .impact-stat .value { font-size: 28px; font-weight: 600; color: #fa8c16; }
        .impact-stat .label { font-size: 13px; color: #8c8c8c; margin-top: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useMemo, useCallback, useEffect, useRef } = React;
        const antd = window.antd;
        const icons = window.icons;
        const {
            Layout, Menu, Button, Table, Tag, Badge, Alert, Card, Space,
            Modal, Form, Input, Select, InputNumber, Slider, Drawer, Tabs,
            Descriptions, Timeline, Checkbox, Tooltip, Row, Col, Divider,
            message, List, Typography
        } = antd;
        const {
            ArrowLeftOutlined, QuestionCircleOutlined, MessageOutlined,
            RocketOutlined, DatabaseOutlined, FileTextOutlined, RobotOutlined,
            ExperimentOutlined, UserOutlined, BarChartOutlined, ColumnWidthOutlined,
            EditOutlined, PlusOutlined, LinkOutlined, DisconnectOutlined,
            CheckCircleOutlined, CloseCircleOutlined, ExclamationCircleOutlined,
            InfoCircleOutlined, SwapOutlined, SettingOutlined, SafetyCertificateOutlined,
            ClockCircleOutlined, ThunderboltOutlined, SmileOutlined
        } = icons;

        const { Sider, Content } = Layout;
        const { Option } = Select;
        const { Text } = Typography;

        // ─── Mock Data ─────────────────────────────────────────────────
        const profileData = {
            name: '生产方案-中英双语',
            status: 'published',
            llmModel: 'GPT-4o',
            routeStrategy: 'intent_first',
            sessionTimeout: 10,
            intentThreshold: 0.60,
            currentVersion: 'v2.1',
            createdAt: '2026-02-15 10:00:00',
            updatedAt: '2026-03-17 14:30:00'
        };

        const boundLibraries = [
            { id: 'lib_001', name: '中文指令库', key: 'zh_intents_v1', language: 'zh', intentCount: 39, hasPublished: true, publishedVersion: 'v2.0' },
            { id: 'lib_002', name: '英文指令库', key: 'en_intents_v1', language: 'en', intentCount: 12, hasPublished: true, publishedVersion: 'v1.1' }
        ];

        const availableLibraries = [
            ...boundLibraries,
            { id: 'lib_003', name: '日语指令库', key: 'ja_intents_v1', language: 'ja', intentCount: 8, hasPublished: false, publishedVersion: null },
            { id: 'lib_004', name: '测试指令库', key: 'test_intents_v1', language: 'zh', intentCount: 5, hasPublished: false, publishedVersion: null }
        ];

        const mockPersonas = [
            { id: 'persona_001', name: '活泼厨房助手', personality: '热情友好、幽默风趣、乐于助人', toneStyle: '亲切随和，偶尔使用emoji，称呼用户为小主', isActive: true },
            { id: 'persona_002', name: '专业厨房顾问', personality: '严谨专业、知识渊博、一丝不苟', toneStyle: '正式礼貌，使用专业术语，数据驱动建议', isActive: false },
            { id: 'persona_003', name: '温柔美食家', personality: '温暖体贴、感性浪漫、注重美感', toneStyle: '温柔细腻，善用比喻，关注食材故事', isActive: false }
        ];

        const publishHistory = [
            { version: 'v2.1', time: '2026-03-17 14:30', desc: '更新人设+英文库', isCurrent: true },
            { version: 'v2.0', time: '2026-03-10 09:00', desc: '初次绑定英文库', isCurrent: false },
            { version: 'v1.0', time: '2026-02-15 10:00', desc: '首次发布', isCurrent: false }
        ];

        // ─── App ────────────────────────────────────────────────────────
        function App() {
            const inIframe = typeof window !== 'undefined' && window.self !== window.top;
            const [openKeys, setOpenKeys] = useState(['config']);
            const [drawerVisible, setDrawerVisible] = useState(false);
            const [drawerWidth, setDrawerWidth] = useState(1200);

            const [editModalVisible, setEditModalVisible] = useState(false);
            const [bindModalVisible, setBindModalVisible] = useState(false);
            const [publishModalVisible, setPublishModalVisible] = useState(false);
            const [personaModalVisible, setPersonaModalVisible] = useState(false);
            const [personaEditModalVisible, setPersonaEditModalVisible] = useState(false);
            const [personaNewModalVisible, setPersonaNewModalVisible] = useState(false);

            const [publishConfirm, setPublishConfirm] = useState(false);
            const [countdown, setCountdown] = useState(0);

            const [editForm] = Form.useForm();
            const [personaEditForm] = Form.useForm();
            const [personaNewForm] = Form.useForm();

            const [selectedBoundKeys, setSelectedBoundKeys] = useState(
                boundLibraries.map(l => l.id)
            );

            const [personas, setPersonas] = useState(mockPersonas);
            const [editingPersona, setEditingPersona] = useState(null);

            const activePersona = useMemo(() => personas.find(p => p.isActive), [personas]);

            const hasPermission = true;

            const allLibsHavePublished = useMemo(
                () => boundLibraries.every(l => l.hasPublished),
                []
            );

            const validationChecks = useMemo(() => [
                { pass: boundLibraries.length > 0, label: `已绑定 ${boundLibraries.length} 个指令库` },
                ...boundLibraries.map(lib => ({
                    pass: lib.hasPublished,
                    label: lib.hasPublished
                        ? `${lib.name} (${lib.key}) 存在 published 模型 ${lib.publishedVersion}`
                        : `${lib.name} (${lib.key}) 尚无已发布模型`
                })),
                { pass: !!activePersona, label: '已配置闲聊人设' },
                { pass: !!profileData.llmModel, label: '已配置大模型' }
            ], [activePersona]);

            const canPublish = useMemo(
                () => validationChecks.every(c => c.pass),
                [validationChecks]
            );

            // countdown timer
            useEffect(() => {
                if (countdown <= 0) return;
                const timer = setTimeout(() => setCountdown(c => c - 1), 1000);
                return () => clearTimeout(timer);
            }, [countdown]);

            // mermaid init
            useEffect(() => {
                if (window.mermaid) {
                    window.mermaid.initialize({ startOnLoad: false, theme: 'default' });
                }
            }, []);

            useEffect(() => {
                if (!drawerVisible || !window.mermaid) return;
                const timer = setTimeout(() => {
                    document.querySelectorAll('.mermaid-pending').forEach(el => {
                        const id = 'mermaid-' + Math.random().toString(36).slice(2, 9);
                        window.mermaid.render(id, el.textContent).then(({ svg }) => {
                            el.innerHTML = svg;
                            el.classList.remove('mermaid-pending');
                        }).catch(() => {});
                    });
                }, 400);
                return () => clearTimeout(timer);
            }, [drawerVisible]);

            const handleOpenChange = useCallback((keys) => {
                setOpenKeys(keys);
            }, []);

            const goTo = (page) => {
                if (page === 'index') window.location.href = 'index.html';
                else if (page === 'test-chat') window.location.href = 'test-chat.html';
            };

            const openPublishModal = () => {
                setPublishModalVisible(true);
                setPublishConfirm(false);
                setCountdown(5);
            };

            const openEditModal = () => {
                editForm.setFieldsValue({
                    name: profileData.name,
                    llmModel: profileData.llmModel,
                    routeStrategy: profileData.routeStrategy,
                    intentThreshold: profileData.intentThreshold,
                    sessionTimeout: profileData.sessionTimeout
                });
                setEditModalVisible(true);
            };

            const openPersonaEdit = (persona) => {
                setEditingPersona(persona);
                personaEditForm.setFieldsValue({
                    name: persona.name,
                    personality: persona.personality,
                    toneStyle: persona.toneStyle
                });
                setPersonaEditModalVisible(true);
            };

            const switchPersona = (persona) => {
                setPersonas(prev => prev.map(p => ({ ...p, isActive: p.id === persona.id })));
                setPersonaModalVisible(false);
                message.success(`已切换人设为"${persona.name}"`);
            };

            const toggleDrawerWidth = () => {
                setDrawerWidth(prev => prev === 1200 ? 800 : 1200);
            };

            const menuItems = [
                {
                    key: 'config', icon: <SettingOutlined />, label: '配置管理',
                    children: [
                        { key: 'libraries', icon: <DatabaseOutlined />, label: '指令库管理' },
                        { key: 'datasets', icon: <FileTextOutlined />, label: '数据集管理' },
                        { key: 'profiles', icon: <RobotOutlined />, label: '对话方案' }
                    ]
                },
                {
                    key: 'testing', icon: <ExperimentOutlined />, label: '测试验证',
                    children: [
                        { key: 'manual-test', icon: <MessageOutlined />, label: '手动测试' },
                        { key: 'batch-test', icon: <ExperimentOutlined />, label: '批量测试' }
                    ]
                },
                {
                    key: 'system', icon: <UserOutlined />, label: '系统管理',
                    children: [
                        { key: 'versions', icon: <RocketOutlined />, label: '版本管理' },
                        { key: 'users', icon: <UserOutlined />, label: '用户管理' },
                        { key: 'monitoring', icon: <BarChartOutlined />, label: '监控仪表盘' }
                    ]
                }
            ];

            const libraryColumns = [
                {
                    title: '指令库名称', dataIndex: 'name', key: 'name',
                    render: (text) => (
                        <a onClick={() => window.location.href = '../pd-intent-library/detail.html'} style={{ fontWeight: 500 }}>{text}</a>
                    )
                },
                {
                    title: 'library_key', dataIndex: 'key', key: 'key',
                    render: (text) => <Text code>{text}</Text>
                },
                {
                    title: '语种', dataIndex: 'language', key: 'language',
                    render: (lang) => (
                        <Tag color={lang === 'zh' ? 'blue' : lang === 'en' ? 'green' : 'orange'}>
                            {lang === 'zh' ? '中文' : lang === 'en' ? 'English' : lang.toUpperCase()}
                        </Tag>
                    )
                },
                { title: '意图数', dataIndex: 'intentCount', key: 'intentCount', width: 80 },
                {
                    title: 'Published 模型', key: 'published',
                    render: (_, record) => record.hasPublished
                        ? <span style={{ color: '#52c41a' }}><CheckCircleOutlined /> 有 ({record.publishedVersion})</span>
                        : <span style={{ color: '#ff4d4f' }}><CloseCircleOutlined /> 无</span>
                },
                {
                    title: '操作', key: 'action', width: 100,
                    render: (_, record) => (
                        <Button
                            type="link"
                            danger
                            size="small"
                            icon={<DisconnectOutlined />}
                            onClick={() => Modal.confirm({
                                title: '确认解绑',
                                content: `确定要解绑指令库"${record.name}"吗？解绑后该方案将不再使用此指令库进行意图识别。`,
                                okType: 'danger',
                                maskClosable: false,
                                onOk: () => message.success(`已解绑"${record.name}"`)
                            })}
                        >
                            解绑
                        </Button>
                    )
                }
            ];

            const bindLibraryColumns = [
                { title: '指令库名称', dataIndex: 'name', key: 'name' },
                { title: 'library_key', dataIndex: 'key', key: 'key', render: (t) => <Text code>{t}</Text> },
                {
                    title: '语种', dataIndex: 'language', key: 'language',
                    render: (lang) => (
                        <Tag color={lang === 'zh' ? 'blue' : lang === 'en' ? 'green' : 'orange'}>
                            {lang === 'zh' ? '中文' : lang === 'en' ? 'English' : lang.toUpperCase()}
                        </Tag>
                    )
                },
                { title: '意图数', dataIndex: 'intentCount', key: 'intentCount', width: 80 },
                {
                    title: 'Published 模型', key: 'published',
                    render: (_, record) => record.hasPublished
                        ? <Tag color="success">有 ({record.publishedVersion})</Tag>
                        : <Tag color="error">无</Tag>
                }
            ];

            // ─── Render ─────────────────────────────────────────────────
            return (
                <Layout className="page-layout">
                    {!inIframe && (
                    <Sider trigger={null} width={260} className="sidebar">
                        <div className="sidebar-header">
                            <div className="sidebar-logo">SmartChef</div>
                            <div className="sidebar-subtitle">智能对话管理平台</div>
                        </div>
                        <Menu theme="dark" mode="inline" selectedKeys={['profiles']} openKeys={openKeys} onOpenChange={handleOpenChange} onSelect={({ key }) => { if (key === 'profiles') goTo('index'); }} items={menuItems} />
                    </Sider>
                    )}

                    {/* Main Content */}
                    <Content className={'main-content' + (inIframe ? ' main-content-no-sider' : '')}>
                        {/* Page Header */}
                        <div className="page-header">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                                    <Button icon={<ArrowLeftOutlined />} onClick={() => goTo('index')}>返回</Button>
                                    <div>
                                        <h1 style={{ fontSize: 22, fontWeight: 600, margin: 0, display: 'flex', alignItems: 'center', gap: 8 }}>
                                            方案详情: {profileData.name}
                                            <Tag color="green" style={{ fontSize: 13 }}>已发布</Tag>
                                        </h1>
                                    </div>
                                </div>
                                <Space>
                                    <Button icon={<QuestionCircleOutlined />} onClick={() => setDrawerVisible(true)}>说明</Button>
                                    <Button icon={<MessageOutlined />} onClick={() => goTo('test-chat')}>手动测试</Button>
                                    <Tooltip title={!hasPermission ? '您没有 profile_publish 权限，请联系管理员' : ''}>
                                        <Button
                                            type="primary"
                                            danger={profileData.status === 'published'}
                                            icon={<RocketOutlined />}
                                            disabled={!hasPermission}
                                            onClick={openPublishModal}
                                        >
                                            发布
                                        </Button>
                                    </Tooltip>
                                </Space>
                            </div>
                        </div>

                        {/* Section 1: 基本信息 */}
                        <Card
                            title="基本信息"
                            style={{ marginBottom: 24 }}
                            extra={<Button icon={<EditOutlined />} onClick={openEditModal}>编辑基本信息</Button>}
                        >
                            <Descriptions column={3} bordered size="small">
                                <Descriptions.Item label="方案名称">{profileData.name}</Descriptions.Item>
                                <Descriptions.Item label="状态"><Tag color="green">已发布</Tag></Descriptions.Item>
                                <Descriptions.Item label="大模型">{profileData.llmModel}</Descriptions.Item>
                                <Descriptions.Item label="路由策略"><Tag color="blue">指令优先</Tag></Descriptions.Item>
                                <Descriptions.Item label="会话超时">{profileData.sessionTimeout} 分钟</Descriptions.Item>
                                <Descriptions.Item label="指令阈值">{profileData.intentThreshold.toFixed(2)}</Descriptions.Item>
                                <Descriptions.Item label="当前发布版本"><Tag color="purple">{profileData.currentVersion}</Tag></Descriptions.Item>
                                <Descriptions.Item label="创建时间">{profileData.createdAt}</Descriptions.Item>
                                <Descriptions.Item label="更新时间">{profileData.updatedAt}</Descriptions.Item>
                            </Descriptions>
                        </Card>

                        {/* Section 2: 指令库绑定 */}
                        <Card
                            title={
                                <Space>
                                    <span>已绑定指令库</span>
                                    <Badge count={boundLibraries.length} style={{ backgroundColor: '#1890ff' }} />
                                </Space>
                            }
                            style={{ marginBottom: 24 }}
                            extra={<Button type="primary" icon={<LinkOutlined />} onClick={() => setBindModalVisible(true)}>绑定指令库</Button>}
                        >
                            <Alert
                                message="方案可并行绑定多个指令库（典型为中文库+英文库），运行时按语言检测自动路由到对应库"
                                type="info"
                                showIcon
                                style={{ marginBottom: 16 }}
                            />
                            <Table
                                columns={libraryColumns}
                                dataSource={boundLibraries}
                                rowKey="id"
                                pagination={false}
                                size="middle"
                            />
                        </Card>

                        {/* Section 3: 闲聊人设配置 */}
                        <Card
                            title="闲聊人设配置"
                            style={{ marginBottom: 24 }}
                            extra={
                                <Space>
                                    <Button icon={<SwapOutlined />} onClick={() => setPersonaModalVisible(true)}>切换人设</Button>
                                    <Button icon={<EditOutlined />} onClick={() => activePersona && openPersonaEdit(activePersona)}>编辑人设</Button>
                                    <Button type="dashed" icon={<PlusOutlined />} onClick={() => { personaNewForm.resetFields(); setPersonaNewModalVisible(true); }}>新建人设</Button>
                                </Space>
                            }
                        >
                            {activePersona && (
                                <div className="persona-card active">
                                    <div className="persona-badge">当前使用</div>
                                    <Descriptions column={1} size="small">
                                        <Descriptions.Item label={<span><SmileOutlined /> 助手名称</span>}>
                                            <Text strong>{activePersona.name}</Text>
                                        </Descriptions.Item>
                                        <Descriptions.Item label="性格特征">{activePersona.personality}</Descriptions.Item>
                                        <Descriptions.Item label="语气风格">{activePersona.toneStyle}</Descriptions.Item>
                                    </Descriptions>
                                </div>
                            )}
                        </Card>

                        {/* Section 4: 版本发布历史 */}
                        <Card title="版本发布历史" style={{ marginBottom: 24 }}>
                            <Timeline
                                items={publishHistory.map(item => ({
                                    color: item.isCurrent ? 'green' : 'gray',
                                    children: (
                                        <div>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                                <Text strong>{item.version}</Text>
                                                {item.isCurrent && <Tag color="green">当前生效</Tag>}
                                            </div>
                                            <div style={{ color: '#8c8c8c', fontSize: 13 }}>
                                                <ClockCircleOutlined style={{ marginRight: 4 }} />{item.time}
                                            </div>
                                            <div style={{ marginTop: 4 }}>{item.desc}</div>
                                        </div>
                                    )
                                }))}
                            />
                        </Card>
                    </Content>

                    {/* ─── Edit Basic Info Modal ──────────────────────────── */}
                    <Modal
                        title="编辑基本信息"
                        open={editModalVisible}
                        maskClosable={false}
                        width={600}
                        onOk={() => {
                            editForm.validateFields().then(() => {
                                message.success('基本信息已更新');
                                setEditModalVisible(false);
                            });
                        }}
                        onCancel={() => setEditModalVisible(false)}
                    >
                        <Form form={editForm} layout="vertical" style={{ marginTop: 16 }}>
                            <Form.Item name="name" label="方案名称" rules={[{ required: true, message: '请输入方案名称' }]}>
                                <Input placeholder="请输入方案名称" allowClear />
                            </Form.Item>
                            <Form.Item name="llmModel" label="大模型选型" rules={[{ required: true, message: '请选择大模型' }]}>
                                <Select placeholder="请选择大模型">
                                    <Option value="GPT-4o">GPT-4o</Option>
                                    <Option value="GPT-4o-mini">GPT-4o-mini</Option>
                                    <Option value="Claude-3.5-Sonnet">Claude-3.5-Sonnet</Option>
                                    <Option value="Qwen-Max">Qwen-Max</Option>
                                    <Option value="DeepSeek-V3">DeepSeek-V3</Option>
                                </Select>
                            </Form.Item>
                            <Form.Item name="routeStrategy" label="路由策略" rules={[{ required: true, message: '请选择路由策略' }]}>
                                <Select placeholder="请选择路由策略">
                                    <Option value="intent_first">指令优先</Option>
                                    <Option value="llm_first">LLM 优先</Option>
                                    <Option value="hybrid">混合策略</Option>
                                </Select>
                            </Form.Item>
                            <Form.Item label="指令阈值" required>
                                <Row gutter={16}>
                                    <Col span={16}>
                                        <Form.Item name="intentThreshold" noStyle>
                                            <Slider min={0} max={1} step={0.05} tooltip={{ formatter: v => `${(v * 100).toFixed(0)}%` }} />
                                        </Form.Item>
                                    </Col>
                                    <Col span={8}>
                                        <Form.Item name="intentThreshold" noStyle>
                                            <InputNumber min={0} max={1} step={0.05} style={{ width: '100%' }} />
                                        </Form.Item>
                                    </Col>
                                </Row>
                            </Form.Item>
                            <Form.Item name="sessionTimeout" label="会话超时（分钟）" rules={[{ required: true, message: '请输入超时时间' }]}>
                                <InputNumber min={1} max={60} style={{ width: '100%' }} placeholder="1~60 分钟" />
                            </Form.Item>
                        </Form>
                    </Modal>

                                            <ol style={{ lineHeight: 2.0, paddingLeft: 20 }}>
                                                <li>方案可并行绑定多个指令库（1:N 关系）</li>
                                                <li>典型场景：中文库 + 英文库，运行时按语言检测路由</li>
                                                <li>同语种的多个库不建议重复绑定（可能产生冲突）</li>
                                                <li>解绑后对应语种的意图识别将失效</li>
                                                <li>绑定库必须存在 published 模型，否则发布门禁不通过</li>
                                            </ol>
                                        </div>
                                        <div className="drawer-section">
                                            <div className="drawer-section-title">指令阈值语义</div>
                                            <Alert
                                                message="intent_threshold 决定 NLU 路由策略的分界线"
                                                description={
                                                    <ul style={{ margin: 0, paddingLeft: 16 }}>
                                                        <li><strong>score &ge; threshold</strong>：识别为指令意图，执行对应槽位填充和指令响应</li>
                                                        <li><strong>score &lt; threshold</strong>：回退到闲聊/大模型路径</li>
                                                        <li><strong>建议值 0.55~0.70</strong>：过高导致漏识别，过低导致误触发</li>
                                                        <li>阈值可在发布后通过新版本调整，需要重新发布</li>
                                                    </ul>
                                                }
                                                type="warning"
                                                showIcon
                                            />
                                        </div>
                                    </div>
                                )
                            },
                            /* Tab 6: 易错点 */
                            {
                                key: 'tips',
                                label: '易错点',
                                children: (
                                    <div>
                                        <Alert
                                            message="发布后会话立即重置"
                                            description="发布新版本后，所有在线设备的进行中会话上下文将被清空。建议在低峰期发布，并提前通知相关人员。"
                                            type="error"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="绑定库无 published 模型将阻断发布"
                                            description="如果绑定的指令库中有任何一个没有 published 状态的模型，发布门禁将不通过。请先在指令库管理中完成模型训练和发布。"
                                            type="error"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="人设切换不影响已有会话"
                                            description="切换人设只在下次发布后对新会话生效。当前已建立的会话仍使用旧人设配置。"
                                            type="warning"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="指令阈值修改需要重新发布"
                                            description="修改 intent_threshold 只更新草稿配置，需要重新发布才能在生产环境生效。切勿认为修改后立即生效。"
                                            type="warning"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="同语种重复绑定可能冲突"
                                            description="如果绑定了两个中文指令库，运行时可能产生路由冲突。建议每种语言只绑定一个指令库。"
                                            type="info"
                                            showIcon
                                            style={{ marginBottom: 12 }}
                                        />
                                        <Alert
                                            message="版本快照不可编辑"
                                            description="发布后创建的版本快照是不可变的（immutable），包含发布时的完整配置副本。如需修改，必须创建新版本重新发布。"
                                            type="info"
                                            showIcon
                                        />
                                    </div>
                                )
                            }
                        ]} />
                    </Drawer>
                </Layout>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
