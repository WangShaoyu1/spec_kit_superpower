                                    React.createElement("div", { className: "value" }, "2026-03-01")

                                    React.createElement("div", { className: "value" }, "2026-03-18 09:33")

                                    React.createElement("div", { className: "label" }, "使用版本"),
                                    React.createElement("div", { className: "value" }, React.createElement(Tag, { color: "cyan" }, "v2.1"))

                                    React.createElement("div", { className: "label" }, "设备状态"),

                    deviceSearched && React.createElement(Card, {
                        title: React.createElement(Space, null,

                        style: { marginBottom: 24 }

                        React.createElement(Table, {

                            dataSource: mockSessions,
                            rowKey: "id",

                            size: "middle",
                            rowClassName: function(record) { return record.id === expandedSession ? "ant-table-row-selected" : ""; }

                    ),

                    // Section 3: Session Detail / Request Chain (FR-032)
                    expandedSession && expandedSessionData && React.createElement(Card, {

                                    React.createElement(Statistic, { title: "会话 ID", value: expandedSessionData.id, valueStyle: { fontSize: 14, fontFamily: "SFMono-Regular, Consolas, monospace" } })

                                        title: "使用版本",
                                        value: expandedSessionData.version,
                                        valueStyle: { fontSize: 16 }
                                    })
                                ),
                                React.createElement(Col, { span: 4 },
                                    React.createElement("div", null,
                                        React.createElement("div", { style: { color: "#8c8c8c", fontSize: 12, marginBottom: 8 } }, "路由分布"),
                                        React.createElement(Space, { size: 4 },
                                            expandedSessionData.routeDist.command > 0 && React.createElement(Tag, { color: "blue" }, "指令 " + expandedSessionData.routeDist.command),
                                            expandedSessionData.routeDist.knowledge > 0 && React.createElement(Tag, { color: "green" }, "知识 " + expandedSessionData.routeDist.knowledge),
                                            expandedSessionData.routeDist.chitchat > 0 && React.createElement(Tag, { color: "orange" }, "闲聊 " + expandedSessionData.routeDist.chitchat)
                                        )
                                    )
                                )
                            )

                        // Request chain timeline
                        React.createElement(Timeline, {
                            items: expandedRequests.map(function(req, idx) {

                                var dotColor = domainCfg.color === "blue" ? "#1890ff" : domainCfg.color === "green" ? "#52c41a" : "#fa8c16";
                                return {
                                    key: req.id,
                                    color: dotColor,
                                    children: React.createElement("div", { style: { marginBottom: 8 } },
                                        React.createElement("div", { style: { marginBottom: 8, display: "flex", alignItems: "center", gap: 8 } },

                                            React.createElement(Text, { type: "secondary", style: { fontSize: 12 } }, req.id)
                                        ),
                                        React.createElement(RequestChainDetail, { request: req, index: idx })

                    ),

                    // Empty state when no device searched
                    !deviceSearched && React.createElement(Card, { style: { textAlign: "center", padding: 60 } },
                        React.createElement(Empty, {

                            )
                        })
                    )
                ),

                // Help Drawer
                React.createElement(Drawer, {
                    title: React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
                        React.createElement("span", null, "页面逻辑说明"),
                        React.createElement(Tooltip, { title: drawerWidth === 1200 ? "切换到窄视图" : "切换到宽视图" },
                            React.createElement(Button, {
                                type: "text",
                                icon: React.createElement(ColumnWidthOutlined, null),
                                onClick: toggleDrawerWidth,
                                size: "small"
                            }, drawerWidth === 1200 ? "800px" : "1200px")
                        )
                    ),
                    width: drawerWidth,
                    open: drawerVisible,
                    onClose: function() { setDrawerVisible(false); }
                },
                    React.createElement(Tabs, { items: drawerTabs })
                )
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
    </script>
